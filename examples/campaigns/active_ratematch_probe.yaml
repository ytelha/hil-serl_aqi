# =====================================================================
# active_ratematch_probe.yaml -- FAST calibration probe (NOT a result run).
#
# Purpose: MEASURE the realized intervention rate of each candidate active arm
# before committing ~6 days to the full active_ratematch. Offline simulation
# cannot predict the rate (it depends on sigma_Q's temporal clustering), and the
# request duty cycle (cooldown/min_on) caps/compresses it -- so we measure on a
# real cell. The quantile trigger is scale-adaptive, so even this short/early
# run gives a representative rate per target.
#
# 5 arms x 1 operator (int00) x 1 seed = 5 cells, 8000 steps, NO convergence
# stop, eval/analyze SKIPPED (run with --stages sample,demos,train). ~3 h.
#
# After it finishes, read each cell's intervention rate from its step log and
# pick the 3 active targets for active_ratematch so the arms SEPARATE and
# bracket logged (~54%).
#
# Launch:
#   WANDB_RUN_GROUP=ratematch_probe systemd-run --user --unit=rm_probe \
#     --collect -p ManagedOOMPreference=avoid -p WorkingDirectory=<repo> \
#     -- bash -c './.venv/bin/python examples/run_campaign.py \
#          --config examples/campaigns/active_ratematch_probe.yaml \
#          --campaign runs/active_ratematch_probe \
#          --stages sample,demos,train --wandb offline \
#          >> runs/active_ratematch_probe.out 2>&1'
# =====================================================================

task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid

operators:
  intermediate: 1                  # int00 only -- representative; quantile is
  jitter: 0.15                     # per-run adaptive so one tier calibrates all
  sample_seed: 0

demos:
  per_operator: 6
  filtered: true
  max_attempts: 300

methods:
  - logged
  - active-taua
  - active-q10
  - active-q30
  - active-q55

arms:
  logged:      {mode: logged}
  active-taua: {mode: active, tau_A: 0.5, query_cooldown_steps: 20}
  active-q10:  {mode: active, query_target_rate: 0.10, query_cooldown_steps: 5}
  active-q30:  {mode: active, query_target_rate: 0.30, query_cooldown_steps: 5}
  active-q55:  {mode: active, query_target_rate: 0.55, query_cooldown_steps: 5}

replicates:
  seeds: 1
  seed_base: 0

budget:
  mode: steps
  steps_cap: 8000                  # enough past warmup(1000) to measure the rate
  minutes_per_cell: 45
  converge_success: 0.0            # OFF: all cells run the full 8000 for a fair rate
  converge_eval_threshold: 0.0
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 3
  demo_pretrain: true
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0.00015

aqi:
  synthetic_intervention_mode: signal
  trigger_terms: [uncertainty]
  trigger_combiner: max
  query_behavior: continue
  quality_cf_diag: true
  critic_ensemble_size: 8
  critic_subsample_size: 1
  per_member_targets: true

eval:
  dx_mm: [-16, -8, 0, 8, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 3
  select: best_window
  window_k: 2

gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2

logging:
  wandb: "off"

analysis:
  baseline: logged
  plots: false
