# =====================================================================
# quality_on_rq4_diag.yaml — SIGNAL DIAGNOSTIC (step 1), not a headline run.
#
# Question: now that RQ4 gave us a HEALTHY critic (K=8, M=1 no min-Q pessimism,
# warm-start, LR 1.5e-4 -> converges, operator-independent), does the
# counterfactual-advantage quality signal q_int = mu_Q(a_H) - mu_Q(a_robot)
# become LARGER and SKILL-DISCRIMINATIVE, instead of the ~1e-3 skill-BLIND
# signal it was on RQ3's broken ensemble (rq3 doc S18)?
#
# This runs `quality` mode ON THE RQ4 BASE at tiny scale (1 operator/tier x 3
# tiers x 1 seed = 3 cells) purely to MEASURE the raw q_int distribution +
# AUROC(q_int, post-intervention success). It is the go/no-go gate before a
# full "quality on the fixed ensemble" campaign.
#
# Read-out after it finishes:
#   - runs/quality_on_rq4_diag/report/q_analysis/summary.md  (per-tier q_int)
#   - aqi_analysis.py on the aqi_logs                          (AUROC early/late)
# Compare to RQ3 quality: mean q_int ~0.0004-0.0009, skill-BLIND across tiers.
# GREEN LIGHT if q_int is larger AND separates tiers / AUROC > 0.5.
# =====================================================================

task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid

operators:
  expert: 1                        # 1 operator/tier -> 3 tiers give the per-tier
  intermediate: 1                  # q_int comparison (skill discrimination).
  novice: 1
  jitter: 0.15
  sample_seed: 0

demos:
  per_operator: 6
  filtered: true
  max_attempts: 300

methods:
  - quality                        # only quality: we just need q_int on the
                                   # RQ4-fixed critic (no baseline arm needed).

replicates:
  seeds: 1
  seed_base: 0

budget:
  mode: steps
  steps_cap: 30000                 # enough for a mature critic (warm-up = 5000);
                                   # cheaper than the 40k headline cap.
  minutes_per_cell: 200            # wall-clock safety cap only
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 15
  # ---- RQ4 base fixes (same healthy-ensemble recipe) ----
  demo_pretrain: true
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0.00015

aqi:
  synthetic_intervention_mode: signal
  # ---- RQ4 critic fixes ----
  critic_ensemble_size: 8
  critic_subsample_size: 1
  per_member_targets: true
  # ---- extended quality machinery (as in RQ3 quality) ----
  bc_loss_weight: 0.0
  quality_filters:
    - safety_veto
    - jerk_veto
  per_standardize: true
  per_delta_init: 0.1
  per_eps: 0.05
  per_eta: 1.0
  quality_warmup_steps: 5000
  per_scale_decay: 0.01
  per_refresh_period: 2000
  per_is_beta: 0.5

eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3

gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2

logging:
  wandb: "off"                     # diagnostic probe -> no wandb clutter.

analysis:
  baseline: quality
  plots: true
