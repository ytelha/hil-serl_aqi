# =====================================================================
# active_demos_sweep.yaml -- does more demo data stabilise / help active?
#
# WHY. The headline runs use 6 filtered demos (deliberately modest so online
# interventions still matter). Two open questions: (1) is active's seed
# instability (exp cells swinging 0<->100% between seeds) just demo starvation,
# curable with more demos? (2) are we below ceiling, so the method comparison is
# still meaningful? More demos raise the floor and stabilise training but
# COMPRESS the method gap -- so this is a diagnostic sweep, not a headline.
#
# HOW. demos is a CAMPAIGN-WIDE setting (demos are collected once per
# operator x seed and reused by every arm), so sweep it by launching this SAME
# config THREE times into SEPARATE campaign dirs with a --demos override (CLI >
# YAML). Each level keeps logged (reference) + active so the gap is visible at
# every demo budget.
#
#   ./.venv/bin/python examples/run_campaign.py --config <this> \
#       --demos 6  --campaign runs/active_demos_06  ...
#   ... --demos 12 --campaign runs/active_demos_12 ...
#   ... --demos 20 --campaign runs/active_demos_20 ...
#
# Kept small (2 ops/tier) because it is a robustness check: 2 arms x 3 tiers x
# 2 ops x 2 seeds = 24 cells per level, 72 total across the three levels.
# Read: does active's within-operator (seed) variance fall as demos rise, and
# does the logged-vs-active gap persist or collapse toward ceiling?
#
# RQ4 fixed base; cuboid.
#
# Example launch of the 12-demo level (repeat for 6 and 20):
#   WANDB_RUN_GROUP=active_demos_12 systemd-run --user --unit=active_d12 \
#     --collect -p ManagedOOMPreference=avoid -p WorkingDirectory=<repo> \
#     -- bash -c './.venv/bin/python examples/run_campaign.py \
#          --config examples/campaigns/active_demos_sweep.yaml \
#          --demos 12 --campaign runs/active_demos_12 \
#          --converge_require_autonomous --wandb online \
#          >> runs/active_demos_12.out 2>&1'
# =====================================================================

task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid

operators:
  expert: 2
  intermediate: 2
  novice: 2
  jitter: 0.15
  sample_seed: 0

demos:
  per_operator: 6                  # default level; override on the CLI (6/12/20)
  filtered: true
  max_attempts: 300

methods:
  - logged
  - active

arms:
  logged: {mode: logged}
  active: {mode: active}

replicates:
  seeds: 2
  seed_base: 0

budget:
  mode: steps
  steps_cap: 40000
  minutes_per_cell: 240
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 25
  demo_pretrain: true
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0.00015

aqi:
  synthetic_intervention_mode: signal
  trigger_terms: [uncertainty]
  trigger_combiner: max
  query_behavior: continue
  quality_cf_diag: true
  critic_ensemble_size: 8
  critic_subsample_size: 1
  per_member_targets: true

eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3

gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2

logging:
  wandb: "off"

analysis:
  baseline: logged
  plots: true
