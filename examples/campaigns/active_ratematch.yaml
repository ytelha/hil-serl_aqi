# =====================================================================
# active_ratematch.yaml -- rate-matched trigger comparison (THE headline test).
#
# PROBLEM this fixes. The prior active_effect run compared `logged` (~54%
# intervention) against `active` (~9%) and read the SR gap as "trigger
# quality". That is confounded by VOLUME: 6x less help trivially lowers SR for
# good operators and raises it for bad ones (level, not lift). The only clean
# question is: AT A MATCHED INTERVENTION BUDGET, does timing help by the
# policy's ensemble disagreement sigma_Q beat the hand-engineered geometric
# monitor on AUTONOMOUS success -- and does it dominate the SR-vs-cost frontier?
#
# NEW MECHANISM. `query_target_rate` requests the top-`rate` fraction of recent
# A(s_t) via a running quantile, so the request rate is set EXPLICITLY and is
# scale-free (robust to sigma_Q's drift as the RQ4 ensemble converged -- a
# fixed tau_A fired at an uncontrolled ~9%). This is why `active-loud`
# (bootstrap_p) failed before: z-normalisation means a louder ensemble CANNOT
# change the rate, only the ranking. Here the rate is a knob -- but the request
# DUTY CYCLE (query_cooldown_steps) caps it, so the quantile arms use
# cooldown=5 (at the default 20 they collapse onto one rate). Rates below were
# MEASURED on the rm_probe calibration run (int00, 8k steps).
#
#   arm          mode     timing of help                              ~rate
#   hilserl      hilserl  NONE (plain 2-critic floor)                  0%
#   active-q10   active   sigma_Q quantile, cd=5                       ~14%
#   active-q30   active   sigma_Q quantile, cd=5                       ~34%
#   active-q55   active   sigma_Q quantile, cd=5                       ~44%
#   random-q30   active   RANDOM, rate-matched to active-q30           ~34%  (control)
#   logged       logged   engineered geometric monitor z_task          ~60%
#
# random-q30 fires at random with the identical min_on/cooldown=5 hysteresis,
# tuned (random_request_rate=0.08) to match active-q30's ~34% realized rate ->
# isolates whether sigma_Q's TIMING beats chance at equal budget. The active
# arms span 14->44% below logged's 60%, so the frontier also shows whether
# sigma_Q reaches logged's SR at LOWER cost (efficiency).
#
# Read the result as a FRONTIER: plot autonomous SR vs realized intervention
# rate; active-q10/q30/q55 trace a curve, logged is one point, hilserl the
# intercept. "active dominates" = its curve sits above the logged point.
# Re-run analysis with `--baseline hilserl` (idempotent) for the logged-vs-
# baseline paired test; the YAML baseline is `logged` for the active-vs-logged
# paired tests.
#
# Everything else = RQ4 fixed base (K=8, M=1, per-member, pretrain 5000, LR
# 1.5e-4), cuboid, same demos, same operator oracle, signal handback.
#
# Design: 6 arms x 3 tiers x 3 ops x 2 seeds = 108 cells.
#
# Launch (OOM-protected; wandb ON for the headline run):
#   WANDB_RUN_GROUP=active_ratematch systemd-run --user --unit=active_rm \
#     --collect -p ManagedOOMPreference=avoid -p WorkingDirectory=<repo> \
#     -- bash -c './.venv/bin/python examples/run_campaign.py \
#          --config examples/campaigns/active_ratematch.yaml \
#          --campaign runs/active_ratematch \
#          --converge_require_autonomous --wandb online \
#          >> runs/active_ratematch.out 2>&1'
# =====================================================================

task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid

operators:
  expert: 3
  intermediate: 3
  novice: 3
  jitter: 0.15
  sample_seed: 0                   # same roster as RQ4 / active_effect

demos:
  per_operator: 6
  filtered: true
  max_attempts: 300

methods:
  - hilserl                        # plain 2-critic floor (for logged > baseline)
  - active-q10                     # sigma_Q quantile, cd=5 -> ~14% interventions
  - active-q30                     # sigma_Q quantile, cd=5 -> ~34%
  - active-q55                     # sigma_Q quantile, cd=5 -> ~44%
  - random-q30                     # rate-matched random control for active-q30
  - logged                         # engineered geometric monitor (~60%)

# Request RATES calibrated on the rm_probe run (int00, 8k steps): the quantile
# arms need query_cooldown_steps=5 to SEPARATE -- at the default cd=20 the duty
# cycle collapses q10/q30/q55 onto one rate. Measured intervention rates:
#   active-q10 ~14%, active-q30 ~34%, active-q55 ~44%, logged ~60% (hilserl 0%).
# So the frontier spans 0 -> 14 -> 34 -> 44 -> 60% autonomous-vs-cost.
arms:
  hilserl:     {mode: hilserl}
  active-q10:  {mode: active, query_target_rate: 0.10, query_cooldown_steps: 5}
  active-q30:  {mode: active, query_target_rate: 0.30, query_cooldown_steps: 5}
  active-q55:  {mode: active, query_target_rate: 0.55, query_cooldown_steps: 5}
  random-q30:  {mode: active, trigger_terms: [], random_request_rate: 0.08, query_cooldown_steps: 5}
  logged:      {mode: logged}

# Keep the hilserl baseline TRULY PLAIN (ensemble warm start + lower LR land
# only on the ensemble arms; critic_* are already mode-gated off for hilserl).
method_overrides:
  hilserl:
    demo_pretrain: false
    demo_pretrain_steps: 0
    learning_rate: 0

replicates:
  seeds: 2
  seed_base: 0

budget:
  mode: steps
  steps_cap: 35000
  minutes_per_cell: 240
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 25
  demo_pretrain: true
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0.00015

aqi:
  synthetic_intervention_mode: signal
  trigger_terms: [uncertainty]     # pure ensemble disagreement (inert for logged/hilserl)
  trigger_combiner: max
  query_behavior: continue
  quality_cf_diag: true            # keep ground-truth logging for the audit
  critic_ensemble_size: 8
  critic_subsample_size: 1
  per_member_targets: true

eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3

gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2

logging:
  wandb: "off"                     # overridden to online on the CLI for the headline run.

analysis:
  baseline: logged                 # active-* vs the engineered monitor (paired)
  plots: true
