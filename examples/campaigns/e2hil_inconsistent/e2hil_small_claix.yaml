# =====================================================================
# e2hil_inconsistent/e2hil_small_claix.yaml -- E2HiL against plain HIL-SERL with the inconsistent operator,
# small campaign within the CLAIX student quota (9 GPU-h)
#
# Question: E2HiL (Deng et al., RA-L 2026) drops the batch states whose estimated influence on the policy
# entropy is extreme. Does that selection cope with an operator who is sometimes careless better than plain
# HIL-SERL? The operator's hidden condition is redrawn at every takeover (inattentive in 0.4 of them,
# persistence 0.7) and logged as ground truth (docs/inconsistent_operator.md). Neither arm reads it.
#
# Small campaign: 2 arms x expert and intermediate (1 each) x 1 seed = 4 cells. It decides whether the
# comprehensive campaign (e2hil_confirm_new + e2hil_consistent_new, 72 cells) runs on the second training
# machine; the rule is fixed in docs/e2hil_inconsistent_operator.md. Cut to the budget:
#   - no novice: the inattentive execution uses the novice anchor, so a novice's two conditions barely differ;
#   - 20 k cap instead of 40 k, and the ruler scores the last 8 checkpoints instead of up to 25.
# About 1-1.7 GPU-h per cell, 4-7 GPU-h with the prepare job.
# Same operators as exp00 and int00 of the second machine's 1-per-tier roster (sample_seed 0).
# Platform: the new stack of the inconsistent-operator suite (rotation control, orientation box, orientation
# channel with the stage-0 limits of the second machine, mini-eval convergence, fixed update ratio 1).
# Both arms are plain HIL-SERL from scratch, as in the paper: 2 critics, no demo pre-training.
#
# On CLAIX:
#   bash cluster/claix/submit_campaign.sh examples/campaigns/e2hil_inconsistent/e2hil_small_claix.yaml \
#       e2hil_small_claix --time 03:00:00
# Its cells are never pooled with cells of another machine or another campaign (F3).
# =====================================================================
task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid
  rpy_box: [0.1, 0.1, 0.4]

operators:
  expert: 1
  intermediate: 1
  novice: 0
  jitter: 0.15
  sample_seed: 0

demos:
  per_operator: 6
  filtered: true
  max_attempts: 300

methods:
  - hilserl                        # plain HIL-SERL reference
  - e2hil                          # + E2HiL entropy-bounded actor loss

replicates:
  seeds: 1
  seed_base: 0

budget:
  mode: steps
  steps_cap: 20000                 # budget cut (comprehensive: 40 k)
  minutes_per_cell: 150
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  converge_mode: eval
  converge_eval_every: 2000
  converge_eval_consecutive: 2
  utd_ratio: 1
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 8               # budget cut: the ruler scores the last 8 (comprehensive: 25)
  demo_pretrain: false             # both arms plain: the paper plugs E2HiL
  demo_pretrain_steps: 0           # into HIL-SERL trained from scratch
  demo_pretrain_batch_size: 0
  learning_rate: 0                 # 0 = built-in 3e-4

aqi:
  synthetic_intervention_mode: signal
  synthetic_inconsistent: true    # the inconsistent operator (patch 0018)
  synthetic_bad_share: 0.4
  synthetic_bad_persistence: 0.7
  synthetic_rotation_control: true
  synthetic_orientation_monitor: true
  synthetic_orientation_tilt_rad: 0.384    # stage-0 limits of the second machine (no learning involved)
  synthetic_orientation_yaw_rad: 0.1396
  # ---- E2HiL knobs (inert for hilserl) ----
  e2hil_K: 8                       # MC actions per state (paper: 8)
  e2hil_q_low: 0.05                # drop |c| below the 5th pct  ("noisy")
  e2hil_q_high: 0.90               # drop |c| above the 90th pct ("shortcut")
  e2hil_q_agg: min                 # official code

eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3

gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2

logging:
  wandb: "off"
  takeover_channels: true
  wandb_tags: [e2hil_inconsistent, e2hil_small_claix]

analysis:
  baseline: hilserl
  plots: true
