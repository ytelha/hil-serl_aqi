# =====================================================================
# study/A_consistent.yaml -- study A: the number of critics and the asking rate (docs/comprehensive_study.md)
#
# Consistent operator, experts and intermediates only (the synthetic novice is left out: it answers 2-9 % of the
# robot's requests and its careless mode barely differs from its normal one). New stack: rotation control,
# orientation box, orientation channel, mini-eval stop, fixed update ratio 1. Shorter ruler: pre-training
# checkpoints skipped, newest 8 scored.
#
# Two questions, one campaign, so the references are shared and every arm pairs with every other one by operator and
# seed:
#   1. number of critics: plain HIL-SERL (2 critics, the published method) and ensemble extended with K = 4, 8, 16;
#   2. asking rate: the robot asks in its 40 / 55 / 70 % most uncertain recent steps (K = 8, as on the first machine),
#      and a state-blind random trigger at about the requested share of asks 55 % (timing control).
# 8 arms x (3 experts + 3 intermediates) x 2 seeds = 96 cells.
#
# Why these asking rates: on the first machine success rose 70 -> 81 -> 87 % from asks 10 to 55 %; the 10-on /
# 5-off timing caps the requested share at 67 %, and asks 55 % already requests about 57 %, so asks 70 % is the
# practical ceiling ("ask whenever allowed") and asks 40 % checks the lower side.
# random-55: p = 0.25 per free step requests about 10 / (14 + 1/p) = 56 % of the steps.
#
# Run through the suite driver (it passes the stage-0 orientation limits and runs cells side by side):
#   ./.venv/bin/python examples/synthetic_suite.py --suite study run A_consistent --parallel 2
# Never run it in a folder of another campaign, and never mix its cells with another machine's.
# =====================================================================
task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid
  rpy_box: [0.1, 0.1, 0.4]       # orientation box (patch 0016): roll, pitch, yaw half-widths, rad
operators:
  expert: 3
  intermediate: 3
  novice: 0
  jitter: 0.15
  sample_seed: 0
demos:
  per_operator: 6
  filtered: true
  max_attempts: 300
methods:
  - hilserl                        # plain HIL-SERL: 2 critics, the operator decides
  - ens-k4                         # ensemble extended, 4 critics
  - ens-k8                         # ensemble extended, 8 critics (the fixed ensemble of the thesis)
  - ens-k16                        # ensemble extended, 16 critics
  - asks-40                        # the robot asks in its 40 % most uncertain recent steps
  - asks-55
  - asks-70
  - random-55                      # state-blind requests at about the share of asks-55
arms:
  ens-k4:    {mode: logged, critic_ensemble_size: 4}
  ens-k8:    {mode: logged, critic_ensemble_size: 8}
  ens-k16:   {mode: logged, critic_ensemble_size: 16}
  asks-40:   {mode: active, query_target_rate: 0.40, query_cooldown_steps: 5}
  asks-55:   {mode: active, query_target_rate: 0.55, query_cooldown_steps: 5}
  asks-70:   {mode: active, query_target_rate: 0.70, query_cooldown_steps: 5}
  random-55: {mode: active, trigger_terms: [], random_request_rate: 0.25, query_cooldown_steps: 5}
replicates:
  seeds: 2
  seed_base: 0
budget:
  mode: steps
  steps_cap: 30000                 # the new stack stops near 9 000 steps; the cap only bounds a failing cell
  minutes_per_cell: 240            # wall-clock safety cap only (anti-hang)
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  converge_mode: eval              # the autonomous mini-eval decides (patch 0015)
  converge_eval_every: 2000
  converge_eval_consecutive: 2
  utd_ratio: 1                     # one learner step per env step (patch 0015)
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 12               # the ruler scores the newest 8; about 95 MB per checkpoint (8 critics)
  demo_pretrain: true              # the fixed-ensemble base; plain HIL-SERL opts out below
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0.00015
aqi:
  synthetic_intervention_mode: signal
  synthetic_rotation_control: true        # patch 0014
  synthetic_orientation_monitor: true    # patch 0016; limits from stage 0 (the driver passes them)
  synthetic_orientation_tilt_rad: 0
  synthetic_orientation_yaw_rad: 0
  trigger_terms: [uncertainty]     # the asking gate: the critics' disagreement alone
  trigger_combiner: max
  query_behavior: continue
  quality_cf_diag: true            # per-step simulator truth in the logs (analysis only)
  critic_ensemble_size: 8
  critic_subsample_size: 1
  per_member_targets: true
  bc_loss_weight: 0.0
method_overrides:
  hilserl:
    demo_pretrain: false
    demo_pretrain_steps: 0
    learning_rate: 0
eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3
  skip_pretrain: true              # shorter ruler (patch 0037): no pre-training checkpoints ...
  newest: 8                        # ... and only the newest 8 (0 of 57 scores changed on the second machine)
gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2
logging:
  wandb: "online"                  # needs `wandb login` on the machine once
  takeover_channels: true
  wandb_tags: [comprehensive_study, A_consistent]
analysis:
  baseline: hilserl
  plots: true
