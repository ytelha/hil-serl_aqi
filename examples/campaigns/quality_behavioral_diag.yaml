# =====================================================================
# quality_behavioral_diag.yaml — SIGNAL DIAGNOSTIC (step 2): the REDESIGNED
# score. Identical to quality_on_rq4_diag.yaml (quality on the RQ4-fixed
# critic) EXCEPT quality_score_mode: behavioral -> the graded intervention
# signal is the critic-free composite z(d_value) - z(t_int) - z(f_peak)
# instead of the counterfactual Q-gap A_hat.
#
# Offline re-score of the counterfactual run showed this composite reaches
# AUROC 0.72 vs episode success (vs 0.175 for A_hat) and is skill-discriminative
# (t_int: exp 32 < int 46 < nov 66). This run tests it LIVE: does the online
# behavioral q_int keep AUROC > 0.5 and separate tiers on the fixed critic?
#
# Read-out (same as step 1): report/q_analysis/summary.md + the offline AUROC
# script on runs/quality_behavioral_diag/aqi_logs/.
# =====================================================================

task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid

operators:
  expert: 1
  intermediate: 1
  novice: 1
  jitter: 0.15
  sample_seed: 0

demos:
  per_operator: 6
  filtered: true
  max_attempts: 300

methods:
  - quality

replicates:
  seeds: 1
  seed_base: 0

budget:
  mode: steps
  steps_cap: 30000
  minutes_per_cell: 200
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 15
  demo_pretrain: true
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0.00015

aqi:
  synthetic_intervention_mode: signal
  critic_ensemble_size: 8
  critic_subsample_size: 1
  per_member_targets: true
  bc_loss_weight: 0.0
  quality_filters:
    - safety_veto
    - jerk_veto
  per_standardize: true
  per_delta_init: 0.1
  per_eps: 0.05
  per_eta: 1.0
  quality_warmup_steps: 5000
  per_scale_decay: 0.01
  per_refresh_period: 2000
  per_is_beta: 0.5
  quality_score_mode: behavioral      # <-- the redesigned, critic-free score

eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3

gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2

logging:
  wandb: "off"

analysis:
  baseline: quality
  plots: true
