# =====================================================================
# synthetic_suite/C_full.yaml -- the full stack at thesis scale (stage 3)
#
# Part of the synthetic-operator test suite (docs/synthetic_suite.md). It tests
# the operator and platform changes of patches 0014-0016: rotation control
# (behaviour), the orientation box and the orientation channel (signal), and
# mini-eval convergence and a fixed update ratio (convergence).
#
# Stage 3 (confirmation): the base configuration of the thesis -- 3 operators per
# tier x 2 seeds, 40 k-step cap, the fixed-ensemble settings -- with three arms:
# baseline, ensemble extended and the best asking arm (see `methods`).
# Edit the switches below if the pilots single out a smaller stack than L5.
# Differs from C_reference: the operator and platform switches of L5 (rotation control, orientation box,
# orientation channel, mini-eval convergence, fixed update ratio).
#
# Run it through the suite driver (it passes the orientation limits measured
# in stage 0 and keeps the campaign folders together):
#   ./.venv/bin/python examples/synthetic_suite.py run C_full
# or by hand (orientation limits then fall back to the shape defaults):
#   ./.venv/bin/python examples/run_campaign.py \
#       --config examples/campaigns/synthetic_suite/C_full.yaml \
#       --campaign runs/synthetic_suite/C_full
# Never run it in a folder of another campaign, and never mix its cells with
# cells trained on another machine (updates per env step, finding F3).
# =====================================================================
task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid
  rpy_box: [0.1, 0.1, 0.4]     # orientation box (patch 0016): roll, pitch, yaw half-widths, rad

operators:
  expert: 3
  intermediate: 3
  novice: 3
  jitter: 0.15
  sample_seed: 0

demos:
  per_operator: 6
  filtered: true
  max_attempts: 300

methods:
  - hilserl                        # 2-critic baseline
  - logged                         # ensemble extended: the fixed ensemble (K=8, M=1, warm start, LR/2)
  # - active-q55                   # ADD before running: the best asking arm of the asking-rate
  #                                  campaign (requests in the 55 % most uncertain steps). Copy its
  #                                  exact definition from the training machine's active_ratematch
  #                                  config into `arms:` below; this repo copy has no per-arm request
  #                                  threshold, so it cannot be written here without guessing.

arms: {}

replicates:
  seeds: 2
  seed_base: 0

budget:
  mode: steps
  steps_cap: 40000
  minutes_per_cell: 300           # wall-clock safety cap only (anti-hang)
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  converge_mode: eval                # the autonomous mini-eval decides (patch 0015)
  converge_eval_every: 2000
  converge_eval_consecutive: 2
  utd_ratio: 1                     # fixed learner steps per env step (patch 0015)
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 25
  demo_pretrain: true
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0.00015

aqi:
  synthetic_intervention_mode: signal
  synthetic_rotation_control: true        # patch 0014
  synthetic_orientation_monitor: true    # patch 0016; limits: stage 0 (driver) or shape defaults
  synthetic_orientation_tilt_rad: 0      # 0 = shape default; the driver passes the measured value
  synthetic_orientation_yaw_rad: 0
  critic_ensemble_size: 8
  critic_subsample_size: 1
  per_member_targets: true

method_overrides:
  hilserl:
    demo_pretrain: false
    demo_pretrain_steps: 0
    learning_rate: 0

eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3

gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2

logging:
  wandb: "off"
  takeover_channels: true
  wandb_tags: [synthetic_suite, C_full]

analysis:
  baseline: hilserl
  plots: true
