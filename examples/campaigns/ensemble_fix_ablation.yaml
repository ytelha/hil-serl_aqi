# =====================================================================
# ensemble_fix_ablation.yaml — which part of the ensemble fix mattered?
# (first training machine, NEW STACK, experts and intermediates; 2026-11-06)
#
# The first ensemble extension (RQ3 `logged`: K = 10 critics, target = min of
# M = 2 random critics, no warm start, learning rate 3e-4) lost to plain
# HIL-SERL. The fix (RQ4 `logged`) changed FOUR things at once:
#   1. de-pessimisation  M 2 -> 1   (one random critic per target, no min)
#   2. ensemble size     K 10 -> 8
#   3. warm start        5 000 learner steps on the demonstrations first
#   4. learning rate     3e-4 -> 1.5e-4
# Unchanged in every ensemble arm: per-member targets and bootstrap masks
# p = 0.8 -- both were already on in the first version
# (docs/thesis/rq4_ensemble_convergence_and_qa_log.md 2.3, 2.4).
#
#   arm          mode     K   M  warm start  LR       question
#   ens          logged   10  2  -           3e-4     the first version (base)
#   ens-m1       logged   10  1  -           3e-4     de-pessimisation alone
#   ens-fix      logged    8  1  5000        1.5e-4   all four (= the fixed version)
#   hilserl      hilserl   2  -  -           3e-4     plain HIL-SERL
#   ens-wu       logged   10  2  5000        3e-4     warm start alone
#   ens-wu-lr    logged   10  2  5000        1.5e-4   warm start + halved LR
#   ens-k8       logged    8  2  -           3e-4     fewer critics alone
#   hilserl-wu   hilserl   2  -  5000        3e-4     warm start for HIL-SERL
#
# NEW STACK (the shortened operator and ruler, as on the second machine and in
# the comprehensive study): rotation control (0014), orientation box and twist
# channel (0016; cuboid limits tilt 0.384 / yaw 0.1396 rad from stage 0), the
# mini-eval stop rule and one learner step per env step (0015). The ruler is
# the standard one (the shorter ruler, patch 0037, is not on this machine);
# 12 kept checkpoints keep it short. Experts and intermediates only: the
# synthetic novice is too weak. Needs patches 0014-0016, NOT 0037.
#
# Cells run METHOD BY METHOD in the order of `methods:`, so the most
# informative arms come first (base, de-pessimisation, full fix, HIL-SERL).
#
# COST: 8 arms x 12 cells (3 experts + 3 intermediates x 2 seeds) = 96 cells.
# First-machine estimate on this stack: about 30 min online training (about
# 9 000 steps at about 5 per second, learner-bound with utd 1), + about 20 min
# warm start in the four warm-start arms, + about 30 min ruler (12 checkpoints),
# so 60-80 min per cell; a cell that never converges runs to the 30 000-step cap
# (about 100 min + ruler). About 5 days in total; the first four arms about
# 2.5 days.
#
# Not comparable with RQ3/RQ4 numbers (old stack, novices, 0.45 updates per
# step); the comparison is between the arms of THIS campaign. Whether the first
# version still loses on the new stack is itself the first read-out (ens vs
# ens-fix vs hilserl).
#
# Launch (OOM-protected):
#   WANDB_RUN_GROUP=ensemble_fix_ablation \
#   systemd-run --user --unit=ens_ablation --collect \
#     -p ManagedOOMPreference=avoid -p WorkingDirectory=<repo> \
#     -- bash -c './.venv/bin/python examples/run_campaign.py \
#          --config examples/campaigns/ensemble_fix_ablation.yaml \
#          --campaign runs/ensemble_fix_ablation \
#          --converge_require_autonomous --wandb online \
#          >> runs/ensemble_fix_ablation.out 2>&1'
# =====================================================================

task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid
  rpy_box: [0.1, 0.1, 0.4]         # orientation box (0016), as on the second machine

operators:
  expert: 3
  intermediate: 3
  novice: 0                        # the synthetic novice is too weak
  jitter: 0.15
  sample_seed: 0

demos:
  per_operator: 6
  filtered: true
  max_attempts: 300

methods:                           # run order = report order
  - ens
  - ens-m1
  - ens-fix
  - hilserl
  - ens-wu
  - ens-wu-lr
  - ens-k8
  - hilserl-wu

arms:
  ens:        {mode: logged, critic_ensemble_size: 10, critic_subsample_size: 2}
  ens-m1:     {mode: logged, critic_ensemble_size: 10, critic_subsample_size: 1}
  ens-fix:    {mode: logged, critic_ensemble_size: 8, critic_subsample_size: 1,
               demo_pretrain: true, demo_pretrain_steps: 5000, learning_rate: 0.00015}
  ens-wu:     {mode: logged, critic_ensemble_size: 10, critic_subsample_size: 2,
               demo_pretrain: true, demo_pretrain_steps: 5000}
  ens-wu-lr:  {mode: logged, critic_ensemble_size: 10, critic_subsample_size: 2,
               demo_pretrain: true, demo_pretrain_steps: 5000, learning_rate: 0.00015}
  ens-k8:     {mode: logged, critic_ensemble_size: 8, critic_subsample_size: 2}
  hilserl-wu: {mode: hilserl, demo_pretrain: true, demo_pretrain_steps: 5000}

replicates:
  seeds: 2
  seed_base: 0

budget:
  mode: steps
  steps_cap: 30000                 # the new stack stops near 9 000 steps; the cap only bounds a failing cell
  minutes_per_cell: 240            # wall-clock safety cap only (anti-hang)
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  converge_mode: eval              # the autonomous mini-eval decides (0015)
  converge_eval_every: 2000
  converge_eval_consecutive: 2
  utd_ratio: 1                     # one learner step per env step (0015)
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 12              # the ruler scores the kept checkpoints; it selects among the last 5
  demo_pretrain: false             # campaign-wide: no warm start; arms opt in
  demo_pretrain_steps: 0
  demo_pretrain_batch_size: 0      # 0 = config batch size (256)
  learning_rate: 0                 # 0 = built-in 3e-4; arms override

aqi:
  synthetic_intervention_mode: signal
  synthetic_rotation_control: true          # 0014
  synthetic_orientation_monitor: true       # 0016
  synthetic_orientation_tilt_rad: 0.384     # stage-0 limits (cuboid), no learning involved;
  synthetic_orientation_yaw_rad: 0.1396     # use this machine's own stage-0 values if it has them
  per_member_targets: true                  # as RQ3/RQ4 (default; inert for hilserl)

eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3

gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2

logging:
  wandb: "off"                     # overridden to online on the CLI
  takeover_channels: true
  wandb_tags: [ensemble_fix_ablation]

analysis:
  baseline: hilserl                # second report with --baseline ens
  plots: true
