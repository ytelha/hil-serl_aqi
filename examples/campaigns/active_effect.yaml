# =====================================================================
# active_effect.yaml -- SIGNAL-vs-SIGNAL head-to-head (RQ3/RQ5 payoff).
#
# Question (the right one): when the operator RESPONDS to a help signal rather
# than judging on its own, does timing the help by the policy's ensemble
# disagreement sigma_Q produce a BETTER, more AUTONOMOUS policy than timing it
# by the hand-engineered geometric monitor? We do NOT ask "does sigma_Q agree
# with the engineered signal" (AUROC) -- sigma_Q may flag good help-moments the
# engineered monitor misses, so agreement is not the target. The only fair test
# is to run BOTH triggers and compare the DOWNSTREAM OUTCOME across tiers.
#
#   arm          mode     interventions timed by
#   logged       logged   the operator's OWN engineered geometric monitor
#                         z_task (corridor / stagnation / force) = engineered
#                         signal; ~54% intervention (trigger-happy)
#   active        active   the policy's sigma_Q gate; operator responds
#                         (trigger = uncertainty, tau_A=0.5) = ~15% request
#   random        active   RATE-MATCHED random requests (no trigger term,
#                         random_request_rate=0.030 ~ active's 15%) = control
#                         for "does sigma_Q's TIMING beat chance?"
#   active-loud   active   sigma_Q gate with a louder ensemble (bootstrap_p
#                         0.5) -- tests if RQ4 convergence muted the signal
#
# Both arms: SAME RQ4 fixed ensemble (K=8, M=1, per-member, warm start 5000, LR
# 1.5e-4), SAME demos, SAME operator oracle quality, SAME intervention mode
# (signal). The ONLY difference is WHAT decides the moment to hand control to
# the operator. quality_cf_diag stays ON for per-step diagnostics.
#
# Primary endpoints (fair under different intervention volumes):
#   - AUTONOMOUS success rate on the frozen ruler (policy ALONE, no operator) --
#     which trigger taught the better standalone policy;
#   - operator-dependence: ICC + per-tier gradient across operators (does the
#     trigger flatten the skill gradient, esp. novice = RQ4's weak tier);
#   - COST: total intervention steps / rate per arm -- report ALONGSIDE SR so a
#     higher-SR arm that simply intervened more is not mistaken for a better
#     trigger (efficiency = autonomous SR per intervention step);
#   - DEPENDENCY TRAJECTORY: intervention rate over training -- does the policy
#     wean off help (the actual goal: reduce dependence on the human)?
#
# CONFOUND to watch: the two triggers may fire at different RATES; more help can
# raise SR independent of trigger quality. Mitigation = lead with autonomous SR
# AT MATCHED/ REPORTED intervention cost + the dependency trajectory; if rates
# diverge sharply, a follow-up tunes tau_A (active) to match the logged rate.
#
# Design: 4 arms x 3 tiers x 3 ops x 2 seeds = 72 cells.
#
# Launch (OOM-protected; wandb ON for the headline run):
#   WANDB_RUN_GROUP=active_effect systemd-run --user --unit=active_eff \
#     --collect -p ManagedOOMPreference=avoid -p WorkingDirectory=<repo> \
#     -- bash -c './.venv/bin/python examples/run_campaign.py \
#          --config examples/campaigns/active_effect.yaml \
#          --campaign runs/active_effect \
#          --converge_require_autonomous --wandb online \
#          >> runs/active_effect.out 2>&1'
# =====================================================================

task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid

operators:
  expert: 3
  intermediate: 3
  novice: 3
  jitter: 0.15
  sample_seed: 0                   # same roster as RQ4

demos:
  per_operator: 6
  filtered: true
  max_attempts: 300

methods:
  - logged                         # interventions timed by the engineered geometric monitor
  - active                         # interventions timed by the sigma_Q gate (tau_A=0.5, ~15% req)
  - random                         # RATE-MATCHED random timing (control: does sigma_Q beat chance?)
  - active-loud                    # sigma_Q gate with a louder ensemble (bootstrap_p 0.5)

# Arm definitions. Only the TRIGGER differs; base mode + all knobs below are
# shared. random = active mode with NO trigger term, requesting at random at a
# rate calibrated (offline, default gate hysteresis) to match active's ~15%
# request fraction -> volume-matched control. active-loud lowers critic
# bootstrap_p so each member sees less data -> more ensemble disagreement
# (tests whether RQ4's converged ensemble muted sigma_Q); caveat: it also
# perturbs the critic, so read its SR cautiously.
arms:
  logged:      {mode: logged}
  active:      {mode: active}
  random:      {mode: active, trigger_terms: [], random_request_rate: 0.030}
  active-loud: {mode: active, bootstrap_p: 0.5}

replicates:
  seeds: 2
  seed_base: 0

budget:
  mode: steps
  steps_cap: 40000
  minutes_per_cell: 240
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 25
  demo_pretrain: true
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0.00015

aqi:
  synthetic_intervention_mode: signal
  trigger_terms: [uncertainty]     # pure ensemble disagreement (inert for logged)
  trigger_combiner: max
  query_behavior: continue
  quality_cf_diag: true            # keep ground-truth logging for the trigger audit
  critic_ensemble_size: 8
  critic_subsample_size: 1
  per_member_targets: true

eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3

gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2

logging:
  wandb: "off"                     # overridden to online on the CLI for the headline run.

analysis:
  baseline: logged                 # deltas vs the engineered-monitor reference
  plots: true
