# =====================================================================
# active_trigger_loudness.yaml -- does a LOUDER ensemble give a better sigma_Q
# RANKING, once the RATE is held fixed? (supersedes the old `active-loud`).
#
# WHY THE OLD active-loud WAS UNINTERPRETABLE. It lowered critic bootstrap_p to
# make the ensemble disagree more, hoping to "un-mute" sigma_Q. But A(s_t) is
# z-normalised, so a uniformly louder sigma_Q leaves the z-score -- and thus the
# request RATE -- unchanged (it only reshuffles WHICH states fire) while also
# perturbing the critic target. So active-loud confounded three things and
# fired at an even lower rate (7%). Result: uninterpretable.
#
# THE CLEAN EXPERIMENT. Hold the request rate FIXED with `query_target_rate`
# (the scale-free quantile knob), then vary ONLY the ensemble loudness via
# bootstrap_p. Now every arm intervenes at the same ~30% budget and the ONLY
# difference is the sigma_Q RANKING across states -- so any SR difference is
# attributable to ranking quality, not rate and not (much) target pessimism.
#
#   arm            mode    rate knob            bootstrap_p   tests
#   logged         logged  engineered monitor   --            engineered reference
#   active-q30     active  quantile 0.30        0.8 (default) converged-ensemble ranking
#   active-q30-md  active  quantile 0.30        0.5           medium-loud ranking
#   active-q30-ld  active  quantile 0.30        0.3           loud ranking
#   random-q30     active  random p=0.30        --            chance ranking (floor)
#
# If louder ensembles do NOT beat random-q30 at the same rate, the ranking of a
# converged ensemble's sigma_Q carries little information -> the active story is
# an EFFICIENCY one (equal SR at lower cost, see active_ratematch.yaml), not a
# "smarter timing" one. If active-q30-ld > random-q30 >~ matches, louder helps.
# bootstrap_p also perturbs the critic target slightly; read SR with that
# caveat (it is why this is a ranking probe, not a headline SR claim).
#
# RQ4 fixed base otherwise (K=8, M=1, per-member, pretrain 5000, LR 1.5e-4).
#
# Design: 5 arms x 3 tiers x 3 ops x 2 seeds = 90 cells.
#
# Launch:
#   WANDB_RUN_GROUP=active_trigger_loudness systemd-run --user --unit=active_tl \
#     --collect -p ManagedOOMPreference=avoid -p WorkingDirectory=<repo> \
#     -- bash -c './.venv/bin/python examples/run_campaign.py \
#          --config examples/campaigns/active_trigger_loudness.yaml \
#          --campaign runs/active_trigger_loudness \
#          --converge_require_autonomous --wandb online \
#          >> runs/active_trigger_loudness.out 2>&1'
# =====================================================================

task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid

operators:
  expert: 3
  intermediate: 3
  novice: 3
  jitter: 0.15
  sample_seed: 0

demos:
  per_operator: 6
  filtered: true
  max_attempts: 300

methods:
  - logged
  - active-q30                      # default ensemble, matched rate
  - active-q30-md                   # bootstrap_p 0.5, matched rate
  - active-q30-ld                   # bootstrap_p 0.3, matched rate
  - random-q30                      # chance timing at the same rate (floor)

arms:
  logged:         {mode: logged}
  active-q30:     {mode: active, query_target_rate: 0.30}
  active-q30-md:  {mode: active, query_target_rate: 0.30, bootstrap_p: 0.5}
  active-q30-ld:  {mode: active, query_target_rate: 0.30, bootstrap_p: 0.3}
  random-q30:     {mode: active, trigger_terms: [], random_request_rate: 0.30}

replicates:
  seeds: 2
  seed_base: 0

budget:
  mode: steps
  steps_cap: 40000
  minutes_per_cell: 240
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 25
  demo_pretrain: true
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0.00015

aqi:
  synthetic_intervention_mode: signal
  trigger_terms: [uncertainty]
  trigger_combiner: max
  query_behavior: continue
  quality_cf_diag: true
  critic_ensemble_size: 8
  critic_subsample_size: 1
  per_member_targets: true

eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3

gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2

logging:
  wandb: "off"

analysis:
  baseline: logged
  plots: true
