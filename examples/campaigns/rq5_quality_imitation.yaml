# =====================================================================
# rq5_quality_imitation.yaml -- C8: quality-WEIGHTED IMITATION.
#
# Every earlier quality campaign used bc_loss_weight 0 (replay priority
# only). This one turns on the weighted BC term of S5.6,
#   L_actor = L_RL + lambda_BC * sum_i w_i NLL_i / sum_i w_i,
# and asks whether the WEIGHTS matter, including the operator-consistency
# factor (SiLRI-style sigma_beta, docs/quality_scores_v2.md):
#
#   arm                  BC weight w_i
#   logged               - (no BC; same-architecture control)
#   quality-unif-bc      uniform (quality_score_mode uniform) = plain BC on
#                        every kept takeover
#   quality-beh-bc       sigmoid(gamma * behavioral score)
#   quality-beh-bc-cons  behavioral x 1/(1+(sigma_beta/sigma_ref)^2): less
#                        imitation where the operator's own earlier
#                        takeovers at similar states disagree
#
# The BC loss is normalised by sum w, so only RELATIVE weights matter; the
# uniform arm is plain BC whatever the constant. The replay priority stays
# as in each score mode (uniform: q = 0 -> baseline priority). So
# quality-beh-bc vs quality-beh-bc-cons isolates the consistency factor,
# and quality-unif-bc vs quality-beh-bc isolates the grading. The
# uniform arm differs in priority too; read that contrast together with
# C7 (quality-beh vs logged).
#
# EVALUATE FIRST: lambda_BC = 0.1 comes from docs/critic_ensemble.md and was
# never run in this repo. Smoke one quality-unif-bc cell and compare wandb
# aqi_bc_loss with the actor loss. If BC dominates (or is invisible), change
# bc_loss_weight in ALL three quality arms before the campaign. Consistency: the
# factor stays 1 until quality_consistency_min_ref (200) takeover steps
# from >= k (5) earlier segments exist. Check consistency_ready in
# segments.jsonl of a smoke quality-beh-bc-cons cell.
#
# Base = C7 (rq5_quality_score.yaml) except bc_loss_weight. The logged_*
# cells are identical to C7's; copy them (see rq5_quality_score_ext.yaml).
# That leaves 54 new cells.
#
# Launch (OOM-protected, as C7):
#   WANDB_RUN_GROUP=rq5_quality_imitation \
#   systemd-run --user --unit=rq5im_campaign --collect \
#     -p ManagedOOMPreference=avoid -p WorkingDirectory=<repo> \
#     -- bash -c './.venv/bin/python examples/run_campaign.py \
#          --config examples/campaigns/rq5_quality_imitation.yaml \
#          --campaign runs/rq5_quality_imitation \
#          --converge_require_autonomous --wandb online \
#          >> runs/rq5_quality_imitation.out 2>&1'
# =====================================================================

task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid

operators:
  expert: 3
  intermediate: 3
  novice: 3
  jitter: 0.15
  sample_seed: 0                   # same roster as RQ4

demos:
  per_operator: 6
  filtered: true
  max_attempts: 300

methods:                           # arm names, report order
  - logged
  - quality-unif-bc
  - quality-beh-bc
  - quality-beh-bc-cons

arms:
  # lambda_BC is set PER ARM (not under aqi:) so the logged_* commands stay
  # byte-identical to C7's; change it in all three arms together.
  quality-unif-bc:     {mode: quality, quality_score_mode: uniform,
                        bc_loss_weight: 0.1}
  quality-beh-bc:      {mode: quality, quality_score_mode: behavioral,
                        bc_loss_weight: 0.1}
  quality-beh-bc-cons: {mode: quality, quality_score_mode: behavioral,
                        bc_loss_weight: 0.1,
                        quality_consistency_weight: true}

replicates:
  seeds: 2
  seed_base: 0

budget:
  mode: steps
  steps_cap: 40000                 # as RQ4
  minutes_per_cell: 300
  converge_success: 0.9            # convergence rule identical to RQ3/RQ4
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 25
  demo_pretrain: true              # RQ4 fix: warm start (hilserl opts out)
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0.00015           # RQ4 fix: halved LR (hilserl opts out)

aqi:
  synthetic_intervention_mode: signal
  # ---- RQ4-fixed ensemble (inert for hilserl) ----
  critic_ensemble_size: 8
  critic_subsample_size: 1
  per_member_targets: true
  # ---- quality module (inert for hilserl / logged) ----
  bc_loss_weight: 0.0              # C8 arms override this with 0.1
  quality_filters:
    - safety_veto
    - jerk_veto
  per_standardize: true
  per_delta_init: 0.1
  per_eps: 0.05
  per_eta: 1.0
  quality_warmup_steps: 5000
  per_scale_decay: 0.01
  per_refresh_period: 2000
  per_is_beta: 0.5
  # ---- operator consistency (quality-beh-bc-cons only): defaults k = 5
  # earlier segments, min_ref 200 steps, running sigma_ref.
  # quality_consistency_k: 5

eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3

gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2

logging:
  wandb: "off"                     # overridden to online on the CLI

analysis:
  baseline: logged
  plots: true
