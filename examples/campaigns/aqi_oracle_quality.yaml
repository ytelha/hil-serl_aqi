# =====================================================================
# aqi_oracle_quality.yaml -- the "perfect quality score" CEILING.
#
# WHAT IT ANSWERS. Every learned intervention-quality score in this project has
# failed (RQ2/RQ3/RQ4: counterfactual A_hat is anti-predictive AUROC 0.175;
# the behavioral "fix" was timing leakage, clean AUROC 0.499). So we do not yet
# know whether the AQI ARCHITECTURE is sound and only the SCORE is broken, or
# whether scoring interventions cannot help at all. This campaign settles that
# by replacing the score with a SIMULATOR-GROUND-TRUTH ORACLE -- the upper
# bound a real score could only approximate -- and asking the thesis question:
#
#   can a perfect quality gate LIFT the weak-operator policy toward the strong-
#   operator one (reduce operator-dependence) WITHOUT dropping the expert,
#   i.e. lift instead of level?
#
# THE ORACLE SCORE (quality_score_mode: oracle; needs quality_cf_diag, sim
# only). Each takeover segment is graded by how much it ACTUALLY resolved task
# trouble, read from the simulator, not estimated from the critic:
#
#   resolved = op_z_task(onset) - op_z_task(handback)      # >=0 = fixed trouble
#   q_seg    = resolved - jam_end + 0.5 * (+1 success / -1 fail)
#            (standardised online so quality_gamma stays dimension-free)
#
# A short expert takeover that drives the geometric trouble signal down, avoids
# a jam and leads to insertion scores high (-> high replay priority + imitation
# weight); a novice takeover that stays jammed or ends in failure scores
# negative (-> q_int = 0 = baseline priority, near-zero BC weight). Crucially it
# is PER-SEGMENT, so it keeps a weak operator's occasional GOOD correction and
# drops its bad ones -- exactly what a perfect score would do. It is a research
# instrument, NOT deployable (no real system sees op_z_task / jam ground truth).
#
#   arm             mode     timing              quality grading
#   logged          logged   engineered ~54%     none (reference)
#   active-q30      active   sigma_Q ~30%        none (timing only)
#   quality-oracle  quality  engineered ~54%     ORACLE (filter at high volume)
#   aqi-oracle      aqi      sigma_Q ~30%        ORACLE (ask-less + filter)
#   aqi-cf          aqi      sigma_Q ~30%        counterfactual (BROKEN score)
#
# READINGS.
#   * quality-oracle vs logged, and aqi-oracle vs active-q30: does oracle
#     filtering LIFT the novice (per-tier SR gradient) and cut ICC without
#     lowering the expert? -> the architecture works, score is the only gap.
#   * aqi-oracle vs aqi-cf: oracle >> cf confirms the broken score (not the
#     architecture) is what sank RQ2-RQ4.
#   * if even the ORACLE cannot lift the novice, intervention scoring itself is
#     the wrong lever -> report as a strong negative and lean on active timing /
#     efficiency (active_ratematch.yaml) instead.
#
# RQ4 fixed base (K=8, M=1, per-member, pretrain 5000, LR 1.5e-4); cuboid.
# NOTE: the oracle's negative segments keep the quality_w_min=0.05 BC floor
# (there is no campaign knob to zero it) but get q_int=0 replay priority, so
# they are down-weighted, not hard-dropped -- sufficient for a ceiling.
#
# Design: 5 arms x 3 tiers x 3 ops x 2 seeds = 90 cells.
#
# Launch:
#   WANDB_RUN_GROUP=aqi_oracle_quality systemd-run --user --unit=aqi_oracle \
#     --collect -p ManagedOOMPreference=avoid -p WorkingDirectory=<repo> \
#     -- bash -c './.venv/bin/python examples/run_campaign.py \
#          --config examples/campaigns/aqi_oracle_quality.yaml \
#          --campaign runs/aqi_oracle_quality \
#          --converge_require_autonomous --wandb online \
#          >> runs/aqi_oracle_quality.out 2>&1'
# =====================================================================

task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid

operators:
  expert: 3
  intermediate: 3
  novice: 3
  jitter: 0.15
  sample_seed: 0

demos:
  per_operator: 6
  filtered: true
  max_attempts: 300

methods:
  - logged
  - active-q30
  - quality-oracle
  - aqi-oracle
  - aqi-cf

arms:
  logged:         {mode: logged}
  active-q30:     {mode: active, query_target_rate: 0.30}
  quality-oracle: {mode: quality}                                   # oracle score (campaign default)
  aqi-oracle:     {mode: aqi, query_target_rate: 0.30}              # oracle score (campaign default)
  aqi-cf:         {mode: aqi, query_target_rate: 0.30, quality_score_mode: counterfactual}

replicates:
  seeds: 2
  seed_base: 0

budget:
  mode: steps
  steps_cap: 40000
  minutes_per_cell: 240
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  total_hours: 72                  # PART-1 cap (~3 days): stops cleanly before the next cell; resume (re-run) for part 2
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 25
  demo_pretrain: true
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0.00015

aqi:
  synthetic_intervention_mode: signal
  trigger_terms: [uncertainty]
  trigger_combiner: max
  query_behavior: continue
  query_cooldown_steps: 5          # calibrated in A: cd=5 gives the active/aqi arms ~30% (inert for logged/quality)
  quality_cf_diag: true            # REQUIRED by the oracle score (captures ground truth)
  quality_score_mode: oracle       # campaign-wide default; aqi-cf overrides to counterfactual
  per_standardize: true            # oracle q_int drives replay priority dimension-free
  per_eta: 1.0
  bc_loss_weight: 0.1              # oracle weights drive the imitation loss
  quality_warmup_steps: 0          # oracle is ground-truth -> trust from step 0
  critic_ensemble_size: 8
  critic_subsample_size: 1
  per_member_targets: true

eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3

gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2

logging:
  wandb: "off"

analysis:
  baseline: logged
  plots: true
