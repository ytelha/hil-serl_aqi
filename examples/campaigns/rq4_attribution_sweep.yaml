# =====================================================================
# rq4_attribution_sweep.yaml — which of RQ4's four ensemble fixes mattered?
#
# RQ4 changed FOUR things on the K-critic ensemble at once (M 2->1, K 10->8,
# demo-pretrain 0->5000, LR 3e-4->1.5e-4) and recovered parity with plain
# HIL-SERL (docs/thesis/rq4_ensemble_convergence_and_qa_log.md sections 8,
# 10.2). This campaign attributes the gain with a CUMULATIVE one-factor
# ladder plus a K sweep, using named ARMS (docs/campaign_runner.md "Arms").
#
#   arm            K   M  pretrain  LR       adds vs previous rung
#   ens-rq3        10  2  off       3e-4     (= RQ3's unfixed `logged`)
#   ens-m1         10  1  off       3e-4     + M=1 (no min-Q pessimism)
#   ens-m1-pt      10  1  5000      3e-4     + demo warm start
#   ens-fix-k10    10  1  5000      1.5e-4   + halved LR  (= all fixes, K=10)
#   ens-fix-k8      8  1  5000      1.5e-4   K 10->8      (= RQ4's `logged`)
#   ens-fix-k4      4  1  5000      1.5e-4   K sweep
#   ens-fix-k2      2  1  5000      1.5e-4   K sweep (ensemble ~ baseline size)
#   hilserl         2  -  off       3e-4     plain reference
#
# per_member_targets=true and bootstrap p=0.8 are shared by every ensemble
# arm, exactly as in RQ3/RQ4. Everything else (roster, demos, 40k-step cap,
# convergence rule, ruler) is copied from rq4_ensemble_convergence.yaml, so
# numbers are directly comparable with RQ4.
#
# COST: each arm = 18 cells (3 tiers x 3 operators x 2 seeds). The default
# `methods:` below runs 6 arms (108 cells). Two of them can be REUSED from
# the RQ4 campaign instead of retrained (see docs/campaign_runner.md "Arms"
# and the copy recipe in docs/e2hil_baseline.md, section "Reusing the RQ4
# hilserl cells"):
#   hilserl_*  <- runs/rq4_ensemble_convergence/{checkpoints,eval_runs}/hilserl_*
#   ens-fix-k8_* <- the RQ4 logged_* cells, directories renamed
#                   logged_<op>_s<seed> -> ens-fix-k8_<op>_s<seed>
# leaving 72 new cells. Add the K sweep with
#   --methods hilserl,ens-rq3,ens-m1,ens-m1-pt,ens-fix-k10,ens-fix-k8,ens-fix-k4,ens-fix-k2
#
# Read-out: report/dependency.md, one row per arm. Successive rungs give the
# marginal effect of each fix; the paired section compares every arm with
# hilserl.
#
# Launch (OOM-protected, as for RQ3/RQ4):
#   WANDB_RUN_GROUP=rq4_attribution_sweep \
#   systemd-run --user --unit=rq4_sweep --collect \
#     -p ManagedOOMPreference=avoid -p WorkingDirectory=<repo> \
#     -- bash -c './.venv/bin/python examples/run_campaign.py \
#          --config examples/campaigns/rq4_attribution_sweep.yaml \
#          --campaign runs/rq4_attribution_sweep \
#          --converge_require_autonomous --wandb online \
#          >> runs/rq4_attribution_sweep.out 2>&1'
# =====================================================================

task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid

operators:
  expert: 3
  intermediate: 3
  novice: 3
  jitter: 0.15
  sample_seed: 0                   # same roster as RQ4

demos:
  per_operator: 6
  filtered: true
  max_attempts: 300

methods:                           # arm names, report order
  - hilserl
  - ens-rq3
  - ens-m1
  - ens-m1-pt
  - ens-fix-k10
  - ens-fix-k8

arms:
  ens-rq3:     {mode: logged, critic_ensemble_size: 10, critic_subsample_size: 2}
  ens-m1:      {mode: logged, critic_ensemble_size: 10, critic_subsample_size: 1}
  ens-m1-pt:   {mode: logged, critic_ensemble_size: 10, critic_subsample_size: 1,
                demo_pretrain: true, demo_pretrain_steps: 5000}
  ens-fix-k10: {mode: logged, critic_ensemble_size: 10, critic_subsample_size: 1,
                demo_pretrain: true, demo_pretrain_steps: 5000,
                learning_rate: 0.00015}
  ens-fix-k8:  {mode: logged, critic_ensemble_size: 8, critic_subsample_size: 1,
                demo_pretrain: true, demo_pretrain_steps: 5000,
                learning_rate: 0.00015}
  ens-fix-k4:  {mode: logged, critic_ensemble_size: 4, critic_subsample_size: 1,
                demo_pretrain: true, demo_pretrain_steps: 5000,
                learning_rate: 0.00015}
  ens-fix-k2:  {mode: logged, critic_ensemble_size: 2, critic_subsample_size: 1,
                demo_pretrain: true, demo_pretrain_steps: 5000,
                learning_rate: 0.00015}

replicates:
  seeds: 2
  seed_base: 0

budget:
  mode: steps
  steps_cap: 40000
  minutes_per_cell: 300
  converge_success: 0.9            # convergence rule identical to RQ3/RQ4
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 25
  demo_pretrain: false             # campaign-wide: plain; arms opt in
  demo_pretrain_steps: 0
  demo_pretrain_batch_size: 0
  learning_rate: 0                 # 0 = built-in 3e-4; arms override

aqi:
  synthetic_intervention_mode: signal
  per_member_targets: true         # as RQ3/RQ4 (inert for hilserl)

eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3

gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2

logging:
  wandb: "off"                     # overridden to online on the CLI

analysis:
  baseline: hilserl
  plots: true
