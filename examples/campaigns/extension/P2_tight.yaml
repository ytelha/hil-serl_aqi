# =====================================================================
# extension/P2_tight.yaml -- phase 2 of the extension study, learning pilot (docs/extension_study.md)
#
# Candidate task "tight": the cuboid with a 6 mm lateral success tolerance instead of 12 mm: the peg must be centred.
#
# Learning pilot: HIL-SERL, the ensemble keeping everything (keepall) and imitation of every correction (bc), with one
# careful intermediate and one careful novice x 2 seeds = 12 cells. The novice's skill is the one the operator screen
# chose for this candidate; the suite passes it as --tier_s_exec / --tier_s_mon novice=<s> (0.3 below is only the
# fallback). The suite picks the main-study task from the pilots by the rule fixed in docs/extension_study.md.
# Platform, ensemble, budget, checkpoints and ruler rules as in the final study (F2_standard); the ruler grid is the
# candidate's own (wider for a wider start range). Run by the extension suite only:
#   python examples/synthetic_suite.py --suite extension all      (tools/run_extension_unattended.sh)
# =====================================================================
task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid
  rpy_box: [0.1, 0.1, 0.4]         # orientation box, as in every new-stack run
  success_lateral: 0.006
operators:
  intermediate: 1
  novice: 1
  jitter: 0.15
  sample_seed: 0
  tier_s_exec: {novice: 0.3}       # fallback; the suite passes the screened skill on the command line
  tier_s_mon: {novice: 0.3}
demos:
  per_operator: 6                  # standard: 6 demonstrations, as in every earlier campaign (F1_hard: 3)
  filtered: true
  max_attempts: 300
methods:
  - hilserl
  - keepall
  - bc
arms:
  keepall:                       # the ensemble keeps every correction, no imitation
    mode: quality
    quality_score_mode: behavioral
    quality_warmup_steps: 1000
    quality_filters: []
    per_eta: 0.0
  bc:                            # imitate every correction, same weight (gamma 0)
    mode: quality
    quality_score_mode: behavioral
    quality_gamma: 0.0
    quality_warmup_steps: 1000
    quality_filters: []
    per_eta: 0.0
    bc_loss_weight: 0.1
replicates:
  seeds: 2
  seed_base: 0
budget:
  mode: steps
  steps_cap: 30000                 # only bounds a failing cell; the mini-eval rule stops a learning one
  minutes_per_cell: 240            # wall-clock safety cap only (anti-hang)
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  converge_mode: eval              # the autonomous mini-eval decides (2 passes in a row at 0.6)
  converge_eval_every: 2000
  converge_eval_consecutive: 2
  utd_ratio: 1                     # one learner step per env step
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 8               # the newest 8 ...
  checkpoint_keep_every: 2000      # ... plus every 2 000-th learner step ...
  checkpoint_keep_until: 17000     # ... up to 17 000 (env 12 000 for the warm-started arms): budget curves
  demo_pretrain: true              # the ensemble's warm start; plain HIL-SERL opts out below
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0                 # 0 = the built-in 3e-4 (the ablation's ens-wu)
aqi:
  synthetic_intervention_mode: signal
  synthetic_inconsistent: false    # careful operators: never careless
  synthetic_rotation_control: true
  synthetic_orientation_monitor: true
  synthetic_orientation_tilt_rad: 0
  synthetic_orientation_yaw_rad: 0
  trigger_terms: [uncertainty]     # the asking gate: the critics' disagreement alone
  trigger_combiner: max
  query_behavior: continue
  quality_cf_diag: true            # per-step simulator truth in the logs (analysis only)
  critic_ensemble_size: 10
  critic_subsample_size: 2
  per_member_targets: true
  bc_loss_weight: 0.0              # no imitation loss in any arm
method_overrides:
  hilserl:
    demo_pretrain: false
    demo_pretrain_steps: 0
    learning_rate: 0
eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3
  skip_pretrain: true              # warm-start checkpoints are not scored ...
  newest: 0                        # ... every other kept checkpoint is (budget curves)
gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2
logging:
  wandb: "online"                  # the driver falls back to offline when no key is set
  takeover_channels: true
  wandb_tags: [extension, pilot, P2_tight]
analysis:
  baseline: hilserl
  plots: true
