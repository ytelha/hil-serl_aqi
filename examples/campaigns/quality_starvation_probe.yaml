# =====================================================================
# quality_starvation_probe.yaml -- does MORE demo data rescue the novice tier
# that campaign C's quality gate collapsed? (mechanism probe for C.)
#
# C finding: a perfect oracle quality gate COLLAPSED the novice (aqi-oracle 36%,
# aqi-cf 9.6% vs logged 65%) by correctly DISCARDING bad novice online
# corrections -> the novice policy STARVES. If that is the mechanism, adding
# demo-buffer signal (NOT subject to the online quality filter) should RESCUE
# the novice under quality; if the novice still collapses at high demos, quality
# is actively HARMFUL, not merely starving.
#
# Design: reuse C's exact novice roster (sample_seed 0, novice x3) so these
# 20-demo cells pair directly with C's 6-demo novice cells -> a 2-point rescue
# curve (6 from C, 20 here) for each arm. Novice tier only (where the collapse
# is); expert/intermediate already sat at ~100% in C.
#
#   arm          timing      quality     C novice SR @ 6 demos
#   logged       engineered  none        65.4%   (control: no quality)
#   active-q30   sigma_Q     none        57.4%   (control: timing, no quality)
#   aqi-oracle   sigma_Q     oracle      36.4%   (the collapsed arm)
#
# 3 arms x 3 novice ops x 2 seeds x 20 demos = 18 cells (~1 day). RQ4 base,
# cuboid, cd=5, quality_cf_diag on -- identical to C except demos 6 -> 20.
#
# Launch:
#   WANDB_RUN_GROUP=quality_starvation_probe systemd-run --user --unit=qstarve \
#     --collect -p ManagedOOMPreference=avoid -p WorkingDirectory=<repo> \
#     -- bash -c './.venv/bin/python examples/run_campaign.py \
#          --config examples/campaigns/quality_starvation_probe.yaml \
#          --campaign runs/quality_starvation_probe \
#          --checkpoint_keep 10 --converge_require_autonomous --wandb offline \
#          >> runs/quality_starvation_probe.out 2>&1'
# =====================================================================

task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid

operators:
  novice: 3                        # C's novice roster (sample_seed 0): nov00/01/02
  jitter: 0.15
  sample_seed: 0

demos:
  per_operator: 20                 # the high-demo point (C used 6)
  filtered: true
  max_attempts: 300

methods:
  - logged
  - active-q30
  - aqi-oracle

arms:
  logged:     {mode: logged}
  active-q30: {mode: active, query_target_rate: 0.30, query_cooldown_steps: 5}
  aqi-oracle: {mode: aqi, query_target_rate: 0.30, query_cooldown_steps: 5}

replicates:
  seeds: 2
  seed_base: 0

budget:
  mode: steps
  steps_cap: 40000
  minutes_per_cell: 240
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 10
  demo_pretrain: true
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0.00015

aqi:
  synthetic_intervention_mode: signal
  trigger_terms: [uncertainty]
  trigger_combiner: max
  query_behavior: continue
  query_cooldown_steps: 5
  quality_cf_diag: true
  quality_score_mode: oracle
  per_standardize: true
  per_eta: 1.0
  bc_loss_weight: 0.1
  quality_warmup_steps: 0
  critic_ensemble_size: 8
  critic_subsample_size: 1
  per_member_targets: true

eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3

gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2

logging:
  wandb: "off"

analysis:
  baseline: logged
  plots: true
