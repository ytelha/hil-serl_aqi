# =====================================================================
# final/F1_hard.yaml -- the final study: does asking help, does grading help, do they add up? (docs/final_study.md)
#
# Asking x grading on the SAME operators and seeds, plus two controls and the reference:
#   keepall          the ensemble; the operator decides when to help; every correction kept      (asking no,  grading no)
#   asks-15          the robot asks in its 15 % most uncertain recent steps                       (asking yes, grading no)
#   beh-discard      the behavioural score drops the lowest-scored 40 % of corrections            (asking no,  grading yes)
#   aqi-15           both                                                                         (asking yes, grading yes)
#   perfect-filter   drops exactly the careless corrections (reads the hidden label): what grading could win at most
#   random-15        requests at random times, about as often as asks-15: does the timing matter?
#   hilserl          plain HIL-SERL (2 critics, no warm start): the reference everyone knows
# 7 arms x (2 experts + 2 intermediates + 2 novices) x 2 seeds = 84 cells.
#
# Why this setting (docs/thesis/final_experiments_plan.md):
#   - harder than the comprehensive study, where every method reached the ceiling: 3 demonstrations instead of 6, a
#     stronger-but-weaker-than-intermediate novice, and every operator careless in 40 % of its takeovers;
#   - the novice is back at skill 0.3 (execution AND monitoring; the old novice was 0): with rotation control and held
#     requests it can rescue and answer, and its careless mode (novice-level execution) still differs from its own;
#   - asking BELOW the operator's own share of help (about 38 % when the operator decided, on the new stack): the
#     open question is whether asking can save help; the same or more help was answered (no gain at the ceiling);
#   - held requests: a request stays up to 30 steps (3 s) until the operator takes over, so slower operators answer;
#     requests replace the operator's own monitor, as in every earlier asking result;
#   - all four factorial cells run the same quality pipeline (corrections scored at the end of the episode), so they
#     differ only in the two switches; no outcome filter and no imitation loss anywhere (the novice test showed the
#     imitation loss collapses a weak operator); the discard share matches the careless share (40 %).
#   - the ensemble base is the ablation's fastest: 10 critics, minimum over 2 in the target, warm start 5 000 steps,
#     learning rate 3e-4 (only the warm start mattered; de-pessimisation and the halved rate added nothing).
#
# Measures: ruler success at the kept checkpoints (the newest 8 and every 2 000-th learner step up to 17 000, i.e.
# environment steps 1 000, 3 000, ..., 11 000 for the warm-started arms) -> success at fixed budgets; steps to the
# first success without help; operator steps; final ruler and last checkpoint; score validity against the label.
#
# Run (unattended, everything): bash tools/run_final_unattended.sh
# Never run it in a folder of another campaign, and never mix its cells with another machine's.
# =====================================================================
task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid
  rpy_box: [0.1, 0.1, 0.4]         # orientation box (roll, pitch, yaw half-widths, rad), as in every new-stack run
operators:
  expert: 2
  intermediate: 2
  novice: 2
  jitter: 0.15
  sample_seed: 0
  tier_s_exec: {novice: 0.3}       # the stronger novice: execution skill 0.3 (0 = the old novice, 1 = expert)
  tier_s_mon: {novice: 0.3}        # ... and monitoring skill 0.3 (when to step in, how fast)
demos:
  per_operator: 3                  # harder: 3 demonstrations instead of 6 (F2_standard keeps 6)
  filtered: true
  max_attempts: 300
methods:
  - hilserl
  - keepall
  - asks-15
  - beh-discard
  - aqi-15
  - perfect-filter
  - random-15
arms:
  keepall:                         # the ensemble, the operator decides, every correction kept
    mode: quality
    quality_score_mode: behavioral # computed and logged only (the score audit reads it)
    quality_warmup_steps: 1000
    quality_filters: []
    per_eta: 0.0
  asks-15:                         # the robot asks; every correction kept
    mode: aqi
    synthetic_request_hold_steps: 30   # held requests: up to 3 s until the operator takes over (per arm: the runner reads it per arm only)
    query_target_rate: 0.15
    query_cooldown_steps: 5
    quality_score_mode: behavioral
    quality_warmup_steps: 1000
    quality_filters: []
    per_eta: 0.0
  beh-discard:                     # the operator decides; the behavioural score drops the lowest 40 %
    mode: quality
    quality_score_mode: behavioral
    quality_warmup_steps: 1000
    quality_filters: [score_filter]
    quality_drop_fraction: 0.4
    per_eta: 0.0
  aqi-15:                          # both: the robot asks, and the score drops the lowest 40 %
    mode: aqi
    synthetic_request_hold_steps: 30   # held requests: up to 3 s until the operator takes over (per arm: the runner reads it per arm only)
    query_target_rate: 0.15
    query_cooldown_steps: 5
    quality_score_mode: behavioral
    quality_warmup_steps: 1000
    quality_filters: [score_filter]
    quality_drop_fraction: 0.4
    per_eta: 0.0
  perfect-filter:                  # the operator decides; drops exactly the careless corrections (reads the label)
    mode: quality
    quality_score_mode: behavioral
    quality_warmup_steps: 1000
    quality_filters: [oracle_filter]
    per_eta: 0.0
  random-15:                       # requests at random free steps, about as often as asks-15; every correction kept
    mode: aqi
    synthetic_request_hold_steps: 30
    trigger_terms: []
    random_request_rate: 0.05
    query_cooldown_steps: 5
    quality_score_mode: behavioral
    quality_warmup_steps: 1000
    quality_filters: []
    per_eta: 0.0
replicates:
  seeds: 2
  seed_base: 0
budget:
  mode: steps
  steps_cap: 30000                 # only bounds a failing cell; the mini-eval rule stops a learning one
  minutes_per_cell: 240            # wall-clock safety cap only (anti-hang)
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  converge_mode: eval              # the autonomous mini-eval decides (2 passes in a row at 0.6)
  converge_eval_every: 2000
  converge_eval_consecutive: 2
  utd_ratio: 1                     # one learner step per env step
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 8               # the newest 8 ...
  checkpoint_keep_every: 2000      # ... plus every 2 000-th learner step ...
  checkpoint_keep_until: 17000     # ... up to 17 000 (env 12 000 for the warm-started arms): budget curves
  demo_pretrain: true              # the ensemble's warm start; plain HIL-SERL opts out below
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0                 # 0 = the built-in 3e-4 (the ablation's ens-wu)
aqi:
  synthetic_intervention_mode: signal
  synthetic_inconsistent: true     # the sometimes-careless operator: careful or careless per takeover (hidden label)
  synthetic_bad_share: 0.4         # careless in 40 % of takeovers ...
  synthetic_bad_persistence: 0.7   # ... in spells of a few takeovers
  synthetic_rotation_control: true
  synthetic_orientation_monitor: true
  synthetic_orientation_tilt_rad: 0
  synthetic_orientation_yaw_rad: 0
  trigger_terms: [uncertainty]     # the asking gate: the critics' disagreement alone
  trigger_combiner: max
  query_behavior: continue
  quality_cf_diag: true            # per-step simulator truth in the logs (analysis only)
  critic_ensemble_size: 10
  critic_subsample_size: 2
  per_member_targets: true
  bc_loss_weight: 0.0              # no imitation loss in any arm
method_overrides:
  hilserl:
    demo_pretrain: false
    demo_pretrain_steps: 0
    learning_rate: 0
eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3
  skip_pretrain: true              # warm-start checkpoints are not scored ...
  newest: 0                        # ... every other kept checkpoint is (budget curves)
gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2
logging:
  wandb: "online"                  # the driver falls back to offline when no key is set
  takeover_channels: true
  wandb_tags: [final_study, F1_hard]
analysis:
  baseline: hilserl
  plots: true
