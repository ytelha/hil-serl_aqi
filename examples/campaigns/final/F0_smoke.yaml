# =====================================================================
# final/F0_smoke.yaml -- smoke test of the final study's new code paths (docs/final_study.md)
#
# One expert and one stronger novice (skill 0.3), one seed, 4 000 steps: the asking + grading arm (held requests, the
# score filter in the AQI pipeline), random requests in the AQI pipeline, and the perfect filter run end to end; the
# checkpoint retention (newest 8 + every 2 000-th step) prunes; the careless operator logs its label. It also
# measures minutes per cell and whether two cells side by side beat one. 3 arms x 2 operators = 6 cells.
# =====================================================================
task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid
  rpy_box: [0.1, 0.1, 0.4]         # orientation box (roll, pitch, yaw half-widths, rad), as in every new-stack run
operators:
  expert: 1
  intermediate: 0
  novice: 1
  jitter: 0.15
  sample_seed: 0
  tier_s_exec: {novice: 0.3}       # the stronger novice: execution skill 0.3 (0 = the old novice, 1 = expert)
  tier_s_mon: {novice: 0.3}        # ... and monitoring skill 0.3 (when to step in, how fast)
demos:
  per_operator: 3                  # harder: 3 demonstrations instead of 6 (F2_standard keeps 6)
  filtered: true
  max_attempts: 300
methods:
  - aqi-15
  - random-15
  - perfect-filter
arms:
  aqi-15:                          # both: the robot asks, and the score drops the lowest 40 %
    mode: aqi
    synthetic_request_hold_steps: 30   # held requests: up to 3 s until the operator takes over (per arm: the runner reads it per arm only)
    query_target_rate: 0.15
    query_cooldown_steps: 5
    quality_score_mode: behavioral
    quality_warmup_steps: 1000
    quality_filters: [score_filter]
    quality_drop_fraction: 0.4
    per_eta: 0.0
  perfect-filter:                  # the operator decides; drops exactly the careless corrections (reads the label)
    mode: quality
    quality_score_mode: behavioral
    quality_warmup_steps: 1000
    quality_filters: [oracle_filter]
    per_eta: 0.0
  random-15:                       # requests at random free steps, about as often as asks-15; every correction kept
    mode: aqi
    synthetic_request_hold_steps: 30
    trigger_terms: []
    random_request_rate: 0.05
    query_cooldown_steps: 5
    quality_score_mode: behavioral
    quality_warmup_steps: 1000
    quality_filters: []
    per_eta: 0.0
replicates:
  seeds: 1
  seed_base: 0
budget:
  mode: steps
  steps_cap: 4000                  # smoke: short, every code path once
  minutes_per_cell: 120
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  converge_mode: eval              # the autonomous mini-eval decides (2 passes in a row at 0.6)
  converge_eval_every: 2000
  converge_eval_consecutive: 2
  utd_ratio: 1                     # one learner step per env step
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 8               # the newest 8 ...
  checkpoint_keep_every: 2000      # ... plus every 2 000-th learner step ...
  checkpoint_keep_until: 17000     # ... up to 17 000 (env 12 000 for the warm-started arms): budget curves
  demo_pretrain: true              # the ensemble's warm start; plain HIL-SERL opts out below
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0                 # 0 = the built-in 3e-4 (the ablation's ens-wu)
aqi:
  synthetic_intervention_mode: signal
  synthetic_inconsistent: true     # the sometimes-careless operator: careful or careless per takeover (hidden label)
  synthetic_bad_share: 0.4         # careless in 40 % of takeovers ...
  synthetic_bad_persistence: 0.7   # ... in spells of a few takeovers
  synthetic_rotation_control: true
  synthetic_orientation_monitor: true
  synthetic_orientation_tilt_rad: 0
  synthetic_orientation_yaw_rad: 0
  trigger_terms: [uncertainty]     # the asking gate: the critics' disagreement alone
  trigger_combiner: max
  query_behavior: continue
  quality_cf_diag: true            # per-step simulator truth in the logs (analysis only)
  critic_ensemble_size: 10
  critic_subsample_size: 2
  per_member_targets: true
  bc_loss_weight: 0.0              # no imitation loss in any arm
method_overrides:
  hilserl:
    demo_pretrain: false
    demo_pretrain_steps: 0
    learning_rate: 0
eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3
  skip_pretrain: true              # warm-start checkpoints are not scored ...
  newest: 0                        # ... every other kept checkpoint is (budget curves)
gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2
logging:
  wandb: "online"                  # the driver falls back to offline when no key is set
  takeover_channels: true
  wandb_tags: [final_study, F0_smoke]
analysis:
  baseline: perfect-filter         # the smoke has no plain HIL-SERL cell
  plots: true
