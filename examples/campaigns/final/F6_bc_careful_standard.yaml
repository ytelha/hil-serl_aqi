# =====================================================================
# final/F6_bc_careful_standard.yaml -- phase 1 of the extension study: imitation on the standard task (docs/extension_study.md)
#
# The final study learned from corrections without imitating them, so dropping a careless correction could change
# little: its steps stay in the online buffer and nothing copies the operator's action. Many intervention methods add
# an imitation (behaviour-cloning) loss on the corrections; there a careless correction is copied, and grading has
# something to act on. This campaign is F2_standard with that loss (weight 0.1, the value of every earlier imitation
# run) and careful operators (never careless): what imitation does when every correction is good.
# Same operators, seeds, demonstrations, ruler, budget and platform as F2_standard: inputs copied from
# runs/final/F2_standard/ and checked by hash (tools/run_final_twins_unattended.sh). Paired by operator and seed with
# F2_standard's keepall / beh-discard / perfect-filter and with F4_careful_standard's careful keepall.
# Every imitation arm uses gamma 0 (each kept correction weighs the same), so the arms differ only in which
# corrections are dropped. tests/test_final_twins.py checks the commands against F2_standard's keepall.
# 1 arm(s) x (2 experts + 2 intermediates + 2 novices at s = 0.3) x 2 seeds = 12 cells.
#
# Run (unattended, phases 0-2): bash tools/run_extension_unattended.sh
# =====================================================================
task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid
  rpy_box: [0.1, 0.1, 0.4]         # orientation box (roll, pitch, yaw half-widths, rad), as in every new-stack run
operators:
  expert: 2
  intermediate: 2
  novice: 2
  jitter: 0.15
  sample_seed: 0
  tier_s_exec: {novice: 0.3}       # the stronger novice: execution skill 0.3 (0 = the old novice, 1 = expert)
  tier_s_mon: {novice: 0.3}        # ... and monitoring skill 0.3 (when to step in, how fast)
demos:
  per_operator: 6                  # standard: 6 demonstrations, as in every earlier campaign (F1_hard: 3)
  filtered: true
  max_attempts: 300
methods:
  - bc
arms:
  bc:                            # imitate every correction, same weight (gamma 0)
    mode: quality
    quality_score_mode: behavioral
    quality_gamma: 0.0
    quality_warmup_steps: 1000
    quality_filters: []
    per_eta: 0.0
    bc_loss_weight: 0.1
replicates:
  seeds: 2
  seed_base: 0
budget:
  mode: steps
  steps_cap: 30000                 # only bounds a failing cell; the mini-eval rule stops a learning one
  minutes_per_cell: 240            # wall-clock safety cap only (anti-hang)
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  converge_mode: eval              # the autonomous mini-eval decides (2 passes in a row at 0.6)
  converge_eval_every: 2000
  converge_eval_consecutive: 2
  utd_ratio: 1                     # one learner step per env step
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 8               # the newest 8 ...
  checkpoint_keep_every: 2000      # ... plus every 2 000-th learner step ...
  checkpoint_keep_until: 17000     # ... up to 17 000 (env 12 000 for the warm-started arms): budget curves
  demo_pretrain: true              # the ensemble's warm start; plain HIL-SERL opts out below
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0                 # 0 = the built-in 3e-4 (the ablation's ens-wu)
aqi:
  synthetic_intervention_mode: signal
  synthetic_inconsistent: false    # careful operators: never careless
  synthetic_rotation_control: true
  synthetic_orientation_monitor: true
  synthetic_orientation_tilt_rad: 0
  synthetic_orientation_yaw_rad: 0
  trigger_terms: [uncertainty]     # the asking gate: the critics' disagreement alone
  trigger_combiner: max
  query_behavior: continue
  quality_cf_diag: true            # per-step simulator truth in the logs (analysis only)
  critic_ensemble_size: 10
  critic_subsample_size: 2
  per_member_targets: true
  bc_loss_weight: 0.0              # no imitation loss in any arm
eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3
  skip_pretrain: true              # warm-start checkpoints are not scored ...
  newest: 0                        # ... every other kept checkpoint is (budget curves)
gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2
logging:
  wandb: "online"                  # the driver falls back to offline when no key is set
  takeover_channels: true
  wandb_tags: [final_study, extension, F6_bc_careful_standard]
analysis:
  baseline: bc
  plots: true
