# =====================================================================
# inconsistent_operator/Q1_validity_new.yaml -- Q1: do the scores find the inattentive corrections?
#
# Part of the inconsistent-operator suite (docs/inconsistent_operator.md):
# does a quality score find the bad corrections of an operator who is
# sometimes attentive and sometimes not, and does keeping the good / dropping
# the bad ones help? The operator's hidden condition is redrawn at every
# takeover (inattentive in 0.4 of them, persistence 0.7) and logged as
# ground truth. Inattentive corrections are sloppy and wrong.
#
# Q1 (score validity): ensemble extended only, which logs every score; 1 operator per tier x 2 seeds
# = 6 cells, 30 k cap. Analysis: examples/inconsistent_operator_audit.py (driver: `audit`).
# Platform: the full stack of the synthetic-operator suite (rotation control, orientation box, orientation channel, mini-eval convergence, fixed update ratio; edit to the stack its pilots chose).
#
#   ./.venv/bin/python examples/synthetic_suite.py --suite inconsistent_operator run Q1_validity_new
# Never run it in a folder of another campaign; never mix machines (F3).
# =====================================================================
task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid
  rpy_box: [0.1, 0.1, 0.4]

operators:
  expert: 1
  intermediate: 1
  novice: 1
  jitter: 0.15
  sample_seed: 0

demos:
  per_operator: 6
  filtered: true
  max_attempts: 300

methods:
  - logged

arms: {}

replicates:
  seeds: 2
  seed_base: 0

budget:
  mode: steps
  steps_cap: 30000
  minutes_per_cell: 240
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  converge_mode: eval
  converge_eval_every: 2000
  converge_eval_consecutive: 2
  utd_ratio: 1
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 25
  demo_pretrain: true                 # the fixed-ensemble base (hilserl opts out)
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0.00015

aqi:
  synthetic_intervention_mode: signal
  synthetic_inconsistent: true    # the inconsistent operator (patch 0018)
  synthetic_bad_share: 0.4
  synthetic_bad_persistence: 0.7
  synthetic_rotation_control: true
  synthetic_orientation_monitor: true
  critic_ensemble_size: 8              # the fixed ensemble
  critic_subsample_size: 1
  per_member_targets: true
  bc_loss_weight: 0.0

method_overrides:
  hilserl:
    demo_pretrain: false
    demo_pretrain_steps: 0
    learning_rate: 0

eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3

gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2

logging:
  wandb: "off"
  takeover_channels: true
  wandb_tags: [inconsistent_operator, Q1_validity_new]

analysis:
  baseline: hilserl
  plots: true
