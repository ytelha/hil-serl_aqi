# =====================================================================
# probe_stab.yaml — STABILITY PROBE (not a study). One cell, one seed.
#
# Finding that motivated this: in rq1_s075_5seed the learner only reached
# ~8.7k gradient steps because autonomous-convergence STOPPED the actor early
# (~19.7k env-steps), and the per-checkpoint ruler SR was 8x 0% + a single
# 88.9% spike at step 7000 -> extreme 0<->100% oscillation on a truncated,
# undertrained policy. best_window then averages mostly troughs.
#
# Question: if we (a) DON'T stop early (train the full 50k env-step budget,
# ~2.5x more gradient steps) and (b) optionally HALVE the LR, does the
# oscillation flatten into a stable plateau? If yes, a multi-seed tier run
# becomes worth the compute; if no, the blocker is deeper (algo/task).
#
# Runs (chained; second adds the half-LR override on the CLI):
#   A default LR:  run_campaign --config probe_stab.yaml --campaign runs/probe_longer
#   B half LR:     run_campaign --config probe_stab.yaml --campaign runs/probe_longer_halflr \
#                      --learning_rate 0.00015
# Both pass --converge_require_autonomous (harmless; convergence is OFF here).
# =====================================================================

task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid

operators:                         # expert tier representative only
  expert: 1
  intermediate: 0
  novice: 0
  jitter: 0.15
  sample_seed: 0                   # same roster as rq1_s075_5seed -> same exp00 theta

demos:
  per_operator: 20
  filtered: true
  max_attempts: 300

methods:
  - hilserl

replicates:
  seeds: 1
  seed_base: 0                     # seed 0 -> reproduces the rq1_s075_5seed exp00_s0 start

budget:
  mode: steps
  steps_cap: 50000                 # FULL env-step budget (no early stop) -> ~22k learner steps
  minutes_per_cell: 300            # safety cap only
  converge_success: 0.0            # <<< DISABLE early-convergence stop: train the whole budget
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.0     # gate off (moot when convergence is off)
  converge_eval_max_steps: 300
  total_hours: 0
  learner_max_steps: 1000000
  learning_rate: 0.0               # 0 = built-in 3e-4 (run A); run B overrides to 1.5e-4 on CLI
  demo_pretrain: false
  demo_pretrain_steps: 0
  demo_pretrain_batch_size: 0

aqi:
  synthetic_intervention_mode: signal

eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3

gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2

logging:
  wandb: "off"

analysis:
  baseline: hilserl
  plots: true
