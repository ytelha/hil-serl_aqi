# =====================================================================
# phase3/X0_probe.yaml -- phase 3 of the extension study, the NaN probe (docs/extension_phase3.md)
#
# Phase 2's hex pilot P1_hex: its keepall run with the careful intermediate int00, seed 0, froze within its first
# episodes (NaN in the learner). This probe runs that run again, twice (keepall and keepall-rerun are the same arm),
# for 3 000 environment steps, on the same inputs: the suite copies P1_hex's operators/int00.json, demos/int00_s0
# and eval_grid.json from runs/extension/P1_hex/ and checks them by hash. Learner metrics every 50 steps
# (learner_metrics.jsonl) and the divergence guard every 50 steps (DIVERGED.json names the first non-finite metrics
# and the last finite ones). Everything else exactly as in P1_hex. Training only, no ruler.
# Reading (suite: runs/phase3/X0_probe/PROBE.md): a divergence in either run reproduces it; which metric breaks
# first points to the cause (critic loss, actor loss, temperature, imitation term).
#
# Run by the phase-3 suite only: bash tools/run_phase3_unattended.sh
# =====================================================================
task:
  exp_name: sim_peg_insertion
  peg_shape: hex
  rpy_box: [0.1, 0.1, 0.4]         # orientation box, as in every new-stack run
operators:
  intermediate: 1                  # int00 only (sampled first, as in P1_hex; the suite copies P1_hex's file anyway)
  jitter: 0.15
  sample_seed: 0
demos:
  per_operator: 6                  # standard: 6 demonstrations, as in every earlier campaign (F1_hard: 3)
  filtered: true
  max_attempts: 300
methods:
  - keepall
  - keepall-rerun
arms:
  keepall:                       # the ensemble keeps every correction, no imitation
    mode: quality
    quality_score_mode: behavioral
    quality_warmup_steps: 1000
    quality_filters: []
    per_eta: 0.0
  keepall-rerun:                 # the same arm again: is the divergence reproducible?
    mode: quality
    quality_score_mode: behavioral
    quality_warmup_steps: 1000
    quality_filters: []
    per_eta: 0.0
replicates:
  seeds: 1
  seed_base: 0
budget:
  mode: steps
  steps_cap: 3000                  # the probe: P1's run froze within its first episodes
  minutes_per_cell: 240            # wall-clock safety cap only (anti-hang)
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 3000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.016,0.000"
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
    - "0.016,0.000"
  converge_mode: eval              # the autonomous mini-eval decides (2 passes in a row at 0.6)
  converge_eval_every: 2000
  converge_eval_consecutive: 2
  utd_ratio: 1                     # one learner step per env step
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 8               # the newest 8 ...
  checkpoint_keep_every: 2000      # ... plus every 2 000-th learner step ...
  checkpoint_keep_until: 17000     # ... up to 17 000 (env 12 000 for the warm-started arms): budget curves
  demo_pretrain: true              # the ensemble's warm start; plain HIL-SERL opts out below
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0                 # 0 = the built-in 3e-4 (the ablation's ens-wu)
  divergence_guard_every: 50       # the probe: the first non-finite learner metric, to the step
  metrics_log_every: 50            # the probe: learner metrics every 50 steps
aqi:
  synthetic_intervention_mode: signal
  synthetic_inconsistent: false    # careful operators: never careless
  synthetic_rotation_control: true
  synthetic_orientation_monitor: true
  synthetic_orientation_tilt_rad: 0
  synthetic_orientation_yaw_rad: 0
  trigger_terms: [uncertainty]     # the asking gate: the critics' disagreement alone
  trigger_combiner: max
  query_behavior: continue
  quality_cf_diag: true            # per-step simulator truth in the logs (analysis only)
  critic_ensemble_size: 10
  critic_subsample_size: 2
  per_member_targets: true
  bc_loss_weight: 0.0              # no imitation loss in any arm
method_overrides:
  hilserl:
    demo_pretrain: false
    demo_pretrain_steps: 0
    learning_rate: 0
eval:
  dx_mm: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3
  skip_pretrain: true              # warm-start checkpoints are not scored ...
  newest: 0                        # ... every other kept checkpoint is (budget curves)
gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2
logging:
  wandb: "online"                  # the driver falls back to offline when no key is set
  takeover_channels: true
  wandb_tags: [extension, phase3, X0_probe]
analysis:
  baseline: hilserl
  plots: true
