# =====================================================================
# phase3/X_smoke.yaml -- phase 3 of the extension study, smoke test (docs/extension_phase3.md)
#
# The new code paths once, before the main campaign: the fixed budget (mini-eval observes, WOULD_STOP.json),
# checkpoints on environment steps with and without the warm start, the divergence guard and the learner metrics,
# careless counts in every arm, E2HiL with the careless label and with the mean over the critics, asking and random
# requests, graded imitation. One sometimes-careless intermediate, seed 0, 4 000 environment steps, a mini-eval and
# a checkpoint every 1 000 steps. 8 arms x 1 operator x 1 seed = 8 runs. The code paths, not the results.
#
# Run by the phase-3 suite only: bash tools/run_phase3_unattended.sh
# =====================================================================
task:
  exp_name: sim_peg_insertion
  peg_shape: hex
  rpy_box: [0.1, 0.1, 0.4]         # orientation box, as in every new-stack run
  random_xy: 0.025                 # the wider start range: +-25 mm ...
  random_rz: 0.2                   # ... and +-0.2 rad
operators:
  intermediate: 1
  jitter: 0.15
  sample_seed: 0
demos:
  per_operator: 6                  # standard: 6 demonstrations
  filtered: true
  max_attempts: 300
methods:
  - hilserl
  - e2hil
  - e2hil-mean
  - keepall
  - bc-random
  - asks-15
  - random-15
  - aqi
arms:
  e2hil-mean:                    # E2HiL's mask alone: the mean over the critics, as in HIL-SERL's actor
    mode: e2hil
    e2hil_q_agg: mean
    demo_pretrain: false
    demo_pretrain_steps: 0
    learning_rate: 0
  keepall:                       # the ensemble keeps every correction, no imitation
    mode: quality
    quality_score_mode: behavioral
    quality_warmup_steps: 1000
    quality_filters: []
    per_eta: 0.0
  bc-random:                     # imitate; drop a random 40 % (same data loss, blind)
    mode: quality
    quality_score_mode: behavioral
    quality_gamma: 0.0
    quality_warmup_steps: 1000
    quality_filters: [random_filter]
    quality_drop_fraction: 0.4
    per_eta: 0.0
    bc_loss_weight: 0.1
  asks-15:                       # the robot asks in its 15 % most uncertain steps; every correction kept
    mode: aqi
    synthetic_request_hold_steps: 30
    query_target_rate: 0.15
    query_cooldown_steps: 5
    quality_score_mode: behavioral
    quality_warmup_steps: 1000
    quality_filters: []
    per_eta: 0.0
  random-15:                     # requests at random times, about as often as asks-15 (final study's definition)
    mode: aqi
    synthetic_request_hold_steps: 30
    trigger_terms: []
    random_request_rate: 0.05
    query_cooldown_steps: 5
    quality_score_mode: behavioral
    quality_warmup_steps: 1000
    quality_filters: []
    per_eta: 0.0
  aqi:                           # asks 15 % + imitate, the score drops the lowest 40 %
    mode: aqi
    synthetic_request_hold_steps: 30
    query_target_rate: 0.15
    query_cooldown_steps: 5
    quality_score_mode: behavioral
    quality_gamma: 0.0
    quality_warmup_steps: 1000
    quality_filters: [score_filter]
    quality_drop_fraction: 0.4
    per_eta: 0.0
    bc_loss_weight: 0.1
replicates:
  seeds: 1
  seed_base: 0
budget:
  mode: steps
  steps_cap: 4000                  # smoke: the code paths only
  minutes_per_cell: 480            # wall-clock safety cap only (anti-hang); E2HiL's update costs about twice
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 1000
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.024,0.000"
    - "-0.012,0.000"
    - "0.000,0.000"
    - "0.012,0.000"
    - "0.024,0.000"
  converge_mode: observe           # the mini-eval runs every 2 000 steps, logs its would-be stop, never stops
  converge_eval_every: 1000
  converge_eval_consecutive: 2
  utd_ratio: 1                     # one learner step per env step
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 8               # unused: environment-step checkpoints are all kept
  checkpoint_env_every: 1000       # smoke: four checkpoints, so success at B can be computed
  divergence_guard_every: 100      # NaN / inf in the learner -> DIVERGED.json, the run is retrained once
  metrics_log_every: 200           # learner metrics in learner_metrics.jsonl
  demo_pretrain: true              # the ensemble's warm start; plain HIL-SERL and E2HiL opt out
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0                 # 0 = the built-in 3e-4
aqi:
  synthetic_intervention_mode: signal
  synthetic_inconsistent: true     # the sometimes-careless operator: careful or careless per takeover (hidden label)
  synthetic_bad_share: 0.4         # careless in 40 % of takeovers ...
  synthetic_bad_persistence: 0.7   # ... in spells of a few takeovers
  synthetic_rotation_control: true
  synthetic_orientation_monitor: true
  synthetic_orientation_tilt_rad: 0
  synthetic_orientation_yaw_rad: 0
  trigger_terms: [uncertainty]     # the asking gate: the critics' disagreement alone
  trigger_combiner: max
  query_behavior: continue
  quality_cf_diag: true            # per-step simulator truth in the logs (analysis only)
  critic_ensemble_size: 10
  critic_subsample_size: 2
  per_member_targets: true
  bc_loss_weight: 0.0              # no imitation loss unless the arm sets it
  e2hil_K: 8                       # E2HiL as in the paper and the comprehensive study
  e2hil_q_low: 0.05
  e2hil_q_high: 0.90
  e2hil_q_agg: min
method_overrides:
  hilserl:
    demo_pretrain: false
    demo_pretrain_steps: 0
    learning_rate: 0
  e2hil:
    demo_pretrain: false
    demo_pretrain_steps: 0
    learning_rate: 0
eval:
  dx_mm: [-24, -18, -12, -6, 0, 6, 12, 18, 24]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 5
  select: best_window
  window_k: 3
  skip_pretrain: true              # warm-start checkpoints are not scored (there are none: env-step checkpoints)
  newest: 0                        # every kept checkpoint is scored: the ten environment-step checkpoints
  after_each_cell: true            # score each run right after training it ...
  prune_keep_last: 3               # ... then keep its best window and its last three checkpoints (disk)
gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2
logging:
  wandb: "online"                  # the driver falls back to offline when no key is set
  takeover_channels: true
  wandb_tags: [extension, phase3, X_smoke]
analysis:
  baseline: hilserl
  plots: true
