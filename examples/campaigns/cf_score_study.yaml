# =====================================================================
# cf_score_study.yaml -- one diagnostic cell for the counterfactual
# intervention score  A_hat = mu_Q(s, a_H) - mu_Q(s, a_robot).
#
# Background: RQ4 section 11 (docs/thesis/rq4_ensemble_convergence_and_qa_log.md)
# found the score ~1e-3 in size, skill-blind and anti-predictive of episode
# success (AUROC 0.175), even with the repaired RQ4 critic. The recorded
# explanation ("a_H is off-distribution") was never tested directly, and
# episode success is a timing-confounded label (docs/quality_signal_audit.md).
#
# This cell trains exactly like the RQ4 quality diagnostic (K8/M1/per-member,
# 5000 demo-pretrain steps, LR 1.5e-4, counterfactual score) and turns on
# quality_cf_diag (logging only), which records per takeover step:
#   every critic's Q at a_H, at the sampled a_robot, at the policy mode, and
#   at 8 fresh policy samples  -> tests baselines, the argmax bias, and the
#                                 across-critic noise of the DIFFERENCE;
#   the simulator ground truth (true lateral error, height, jam) per step
#                              -> a timing-free label of what each takeover
#                                 actually achieved.
# Analysis: docs/counterfactual_score_study.md.
#
#   bash cluster/claix/submit_campaign.sh examples/campaigns/cf_score_study.yaml cf-study --parallel 1 --time 02:30:00
# =====================================================================

task:
  exp_name: sim_peg_insertion
  peg_shape: cuboid

operators:
  intermediate: 1
  jitter: 0.15
  sample_seed: 0

demos:
  per_operator: 6
  filtered: true
  max_attempts: 300

methods:
  - quality                        # counterfactual score (the default mode)

replicates:
  seeds: 1
  seed_base: 0

budget:
  mode: steps
  steps_cap: 25000
  minutes_per_cell: 120            # anti-hang only
  converge_success: 0.9
  converge_window: 20
  converge_min_steps: 25000        # never stop early: we want every takeover
  converge_eval_threshold: 0.6
  converge_eval_max_steps: 300
  converge_eval_poses:
    - "-0.008,0.000"
    - "0.000,0.000"
    - "0.008,0.000"
  total_hours: 0
  learner_max_steps: 1000000
  buffer_period: 0
  checkpoint_keep: 5
  demo_pretrain: true
  demo_pretrain_steps: 5000
  demo_pretrain_batch_size: 0
  learning_rate: 0.00015

aqi:
  synthetic_intervention_mode: signal
  critic_ensemble_size: 8
  critic_subsample_size: 1
  per_member_targets: true
  bc_loss_weight: 0.0
  quality_filters:
    - safety_veto
    - jerk_veto
  per_standardize: true
  per_delta_init: 0.1
  per_eps: 0.05
  per_eta: 1.0
  quality_warmup_steps: 5000
  per_scale_decay: 0.01
  per_refresh_period: 2000
  per_is_beta: 0.5
  quality_cf_diag: true            # logging only

eval:
  dx_mm: [-8, 0, 8]
  yaw:   [0.0]
  reps: 1
  max_steps: 300
  last_k: 3
  select: best_window
  window_k: 2

gpu:
  jax_platform: cuda
  mem_learner: 0.6
  mem_actor: 0.2

logging:
  wandb: "off"

analysis:
  baseline: quality
  plots: false
